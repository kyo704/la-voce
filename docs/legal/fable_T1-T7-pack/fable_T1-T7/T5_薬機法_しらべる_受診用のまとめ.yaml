TOPIC: "T5 薬機法の続き（『しらべる』の統計的な関連の表示／『受診用のまとめ』）"
TLDR: "両方とも、厚労省の非該当例（個人の健康記録の保存・管理・表示。統計処理をした数値の表示を含む／患者の健康状態に関する情報を整理・記録・表示）に入る。境界は『疾病の兆候の検知・疾病候補の表示・受診勧奨・体調異常の検知』。★『関連の1文』が病名・異常・受診に触れない限り NO。窓口相談は任意（自己評価を文書化すれば足りる）"
KEY_FACTS:
  - FACT: "医療機器該当性は、製造販売業者等の表示・説明資料・広告に基づき、使用目的とリスクの程度で判断する。疾病の診断・治療・予防を目的とするか"
    SOURCE_URL: "https://www.pmda.go.jp/files/000240233.pdf"
    SOURCE_REF: "厚労省『プログラムの医療機器該当性に関するガイドライン』令和3年3月31日（令和5年3月31日一部改正）第3章・別紙1"
  - FACT: "非該当の典型例：使用者が自らの医療・健康情報を閲覧等することを目的とするプログラム。『個人の健康記録を保存、管理、表示するプログラム（経時的表示や統計処理をした数値の表示を含む）』"
    SOURCE_URL: "https://www.pmda.go.jp/files/000240233.pdf"
    SOURCE_REF: "同ガイドライン 第4章（医療機器に該当しないプログラム）"
  - FACT: "別紙1 フローチャート③A：『使用者が自らの医療・健康情報の記録・閲覧のためデータの表示、保管、転送するためだけに用いるプログラム』は非該当。『データを時系列に沿って並べ、グラフ化するなど、閲覧のために単純な加工・処理を行うものも含む』"
    SOURCE_URL: "https://www.pmda.go.jp/files/000240233.pdf"
    SOURCE_REF: "同 別紙1"
  - FACT: "判断事例（令和5年3月31日事務連絡）：非該当 A-1)①個人の健康記録プログラム、A-1)②患者の健康状態又は治療内容に関する情報を整理・記録・表示、A-2)②日常の運動を監視して傾向を追跡・行動提案。該当 1-1)②独自アルゴリズムで解析し疾病候補を表示、1-1)③疾病の兆候を通知し受診を促す。A-2)①の注：検知した情報から熱中症等の疾病や『体調異常の検知』を行うものは該当"
    SOURCE_URL: "https://www.mhlw.go.jp/content/11120000/001082229.pdf"
    SOURCE_REF: "厚労省 事務連絡『プログラムの医療機器該当性判断事例について』令和5年3月31日"
  - FACT: "該当性が判然としない場合は、監視指導・麻薬対策課（PMDA SaMD一元的相談窓口経由）で相談できる。任意"
    SOURCE_URL: "https://www.pmda.go.jp/review-services/f2f-pre/strategies/0011.html"
    SOURCE_REF: "PMDA『SaMD一元的相談窓口』ページ・ガイドライン注"
  - FACT: "MPT の基準値：健常成人の平均は男性30秒・女性20秒、男性14秒以下・女性9秒以下は異常とされる（★アプリで表示しないこと）"
    SOURCE_URL: "https://www.jstage.jst.go.jp/article/jibiinkoka/120/5/120_752/_pdf/-char/ja"
    SOURCE_REF: "日本耳鼻咽喉科学会誌 120(5), 2017 専門医通信"
APPLIES_TO_WOOLSONG:
  SHIRABERU_ASSOCIATION_SENTENCE: "NO（条件つき）"
  SHINRYO_SUMMARY: "NO"
CONDITIONS_FOR_NO:
  - "関連の1文は本人の記録どうしの並び（統計処理をした数値の表示の範囲）。病名・疾病候補・『異常』『検知』・受診勧奨を含まない。数値（ρ・効果量）を出さない（設計どおり）"
  - "『はっきりした関係は見えませんでした』は結果の不在の表示であり判定ではない。ただし『問題ありません』『正常です』と書かない"
  - "受診用のまとめは本人の記録の要約で、判定・基準値・所見を含まない。表題は『受診のときに見せる記録』。『診断書』『所見』の語を使わない"
  - "MPT は秒数の記録のみ。基準値・『短い』の評価を出さない"
  - "広告・営業資料・SNS で『不調が減る』『声が良くなる』『病気を早く見つける』の効果を言わない（薬機法68条の未承認医療機器の広告禁止に近づく）"
IF_YES_WHAT_TO_DO:
  - "該当しない設計の自己評価（フローチャートの各分岐と答え）を docs/legal/ に日付つきで保存。厚労省・PMDAへの相談は任意。出すなら削除後の最終仕様で、機能ごとに様式1（記録・関連の1文・MPT・受診用のまとめ）"
