<!doctype html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Woolsong 動く見本 v2</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--enji:#840C24;--yama:#8C6115;--midori:#447862;--paper:#FBF6EA;--card:#fff;
 --line:#E4DAC4;--line2:#F0E9DA;--ink:#261913;--ink2:#6D5D50;--ink3:#7C6C5E;--bg:#EFE7D6}
body{background:var(--bg);font-family:"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;color:var(--ink);
 display:flex;flex-direction:column;align-items:center;padding:22px 14px 60px;gap:13px;line-height:1.7}
h1{font-size:19px;letter-spacing:.04em}
.lead{font-size:12.5px;color:var(--ink2);max-width:600px;text-align:center;line-height:1.9}
/* ─── 端末 ─── */
.ph{width:360px;height:812px;background:var(--paper);border-radius:30px;border:1px solid #DFD4BE;
 box-shadow:0 1px 0 rgba(0,0,0,.03),0 10px 30px rgba(90,72,48,.14);overflow:hidden;
 display:flex;flex-direction:column;position:relative}
.st{flex:0 0 26px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;font-size:9.5px;color:var(--ink3);letter-spacing:.08em}
.off{flex:0 0 20px;background:#6D5D50;color:#fff;font-size:10px;display:flex;align-items:center;justify-content:center;letter-spacing:.04em}
.bd{flex:1;overflow-y:auto;padding:0 15px 18px}
.tabs{flex:0 0 56px;border-top:1px solid var(--line);display:flex;background:#FFFDF7}
.tb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-size:10px;color:var(--ink3);cursor:pointer}
.tb i{width:16px;height:2px;background:transparent;border-radius:2px;display:block}
.tb.on{color:var(--enji);font-weight:700}.tb.on i{background:var(--enji)}
/* ─── 部品 ─── */
.hd{display:flex;align-items:center;justify-content:space-between;padding:10px 1px 6px}
.hd h2{font-size:17px;letter-spacing:.06em}
.gear{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);display:flex;align-items:center;
 justify-content:center;color:var(--ink2);font-size:12px;cursor:pointer;background:#fff;flex:none}
.h3{font-size:10.5px;color:var(--ink3);letter-spacing:.12em;margin:14px 0 7px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 13px;margin-bottom:9px}
.mini{font-size:11.5px;color:var(--ink2)}
.usu{font-size:11px;color:var(--ink3);margin-top:2px}
.note{font-size:11px;color:var(--ink2);line-height:1.85;margin-top:9px}
.warn{background:#F6F1E4;border:1px solid #E8DFC8;border-radius:12px;padding:9px 11px;font-size:11px;color:var(--ink2);line-height:1.75;margin-bottom:10px}
.seg{display:flex;background:#F3ECDD;border-radius:11px;padding:3px;margin:2px 0 10px}
.seg div{flex:1;text-align:center;font-size:11.5px;padding:8px 0;border-radius:9px;color:var(--ink2);cursor:pointer}
.seg div.on{background:#fff;color:var(--enji);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.seg div.rest{opacity:.42}
.pill{display:inline-block;border:1px solid var(--line);border-radius:99px;padding:7px 12px;font-size:11.5px;color:var(--ink2);background:#fff;cursor:pointer}
.pill.on{background:var(--enji);color:#fff;border-color:var(--enji);font-weight:700}
.pill.sm{padding:5px 9px;font-size:10.5px}
.pills{display:flex;gap:6px;margin-bottom:11px;flex-wrap:wrap}
.li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:11px 0;border-bottom:1px solid var(--line2);font-size:13px;cursor:pointer;min-height:44px}
.li:last-child{border:none}
.li s{color:var(--ink3);font-size:11.5px;text-decoration:none;text-align:right;flex:none}
.box{background:#fff;border:1px solid var(--line);border-radius:14px;padding:0 12px;margin-bottom:9px}
.btn{display:block;width:100%;border:0;background:var(--enji);color:#fff;border-radius:13px;padding:14px 0;
 font:inherit;font-size:15px;font-weight:700;text-align:center;cursor:pointer}
.btn.g{background:#fff;color:var(--ink);border:1px solid var(--line);font-weight:400;font-size:13.5px;padding:12px 0}
.btn.sm{font-size:12.5px;padding:10px 0}
.two{display:flex;gap:9px}.two>*{flex:1}
.back{font-size:12.5px;color:var(--enji);cursor:pointer;padding:9px 0 3px;display:inline-block}
.rowb{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.rowb s{width:30px;font-size:9.5px;color:var(--ink3);text-decoration:none;flex:none}
.bar{height:8px;border-radius:4px;background:var(--enji)}
/* ─── ◎○△ ─── */
.tri{display:flex;gap:7px}
.tri div{flex:1;border:1px solid var(--line);border-radius:12px;padding:9px 0 8px;text-align:center;
 background:#FDFAF3;cursor:pointer;min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.tri div .g{font-size:21px;line-height:1;color:var(--enji)}
.tri div .w{font-size:11.5px;color:var(--ink2)}
.tri div.on{border:2px solid var(--enji);background:#fff;padding:8px 0 7px}
.tri div.on .w{color:var(--enji);font-weight:700}
/* ─── 羊 ─── */
.stage{position:relative;background:linear-gradient(#F6EEDC,#EFE4CC);border:1px solid var(--line);
 border-radius:14px;height:236px;overflow:hidden;margin-bottom:9px}
.sh{position:absolute;bottom:14px;left:50%;width:132px;margin-left:-66px;
 transform-origin:50% 100%;animation:idle 3.4s ease-in-out infinite}
.sh img{width:100%;display:block}
@keyframes idle{0%,100%{transform:translateY(0) scaleY(1)}50%{transform:translateY(-4px) scaleY(1.018)}}
.shadow{position:absolute;bottom:10px;left:50%;width:110px;height:16px;margin-left:-55px;border-radius:50%;
 background:rgba(120,98,66,.17);animation:shw 3.4s ease-in-out infinite}
@keyframes shw{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(.9);opacity:.6}}
/* おうち：羊が 手前を 歩く */
.room{position:relative;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#FBF6EA}
.walker{position:absolute;bottom:8px;left:0;width:76px;animation:walk 17s linear infinite}
.walker .bob{animation:bob .62s ease-in-out infinite;transform-origin:50% 100%}
.walker img{width:100%;display:block}
@keyframes walk{
 0%{transform:translateX(26px) scaleX(1)} 42%{transform:translateX(226px) scaleX(1)}
 46%{transform:translateX(226px) scaleX(-1)} 92%{transform:translateX(26px) scaleX(-1)}
 96%,100%{transform:translateX(24px) scaleX(1)}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-1.2deg)}50%{transform:translateY(-5px) rotate(1.2deg)}}
.roomshadow{position:absolute;bottom:5px;left:0;width:62px;height:10px;margin-left:7px;border-radius:50%;
 background:rgba(120,98,66,.15);animation:walk 17s linear infinite}
/* ─── 気になったこと ─── */
.mk{margin-top:2px}
.mkrow{display:flex;align-items:center;gap:6px;margin-bottom:5px}
.mkrow .nm{flex:0 0 96px;font-size:10.5px;color:var(--ink2);line-height:1.3}
.mkrow .cells{flex:1;display:flex;gap:2px}
.mkrow .cells i{flex:1;height:15px;border-radius:3px;background:#F0E9DA;display:block}
.mkrow .cells i.on{background:var(--enji);opacity:.85}
.mkrow .n{flex:0 0 30px;text-align:right;font-size:10px;color:var(--ink3)}
.mkx{display:flex;gap:2px;margin:2px 0 0 102px;font-size:8.5px;color:var(--ink3)}
.mkx span{flex:1;text-align:center}
.wk{display:flex;align-items:flex-end;gap:2px;height:30px}
.wk i{flex:1;border-radius:2px 2px 0 0;display:block}
/* ─── ノート・連絡 ─── */
.nt{background:#fff;border:1px solid var(--line);border-radius:13px;padding:12px 13px;margin-bottom:8px;cursor:pointer}
.nt .t{font-size:13.5px;line-height:1.7}
.nt .m{font-size:10.5px;color:var(--ink3);margin-top:6px}
.rep{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:13px;padding:11px 12px;margin-bottom:8px;cursor:pointer}
.rep .t{font-size:14px;font-weight:700}.rep .s{font-size:10.5px;color:var(--ink3);margin-top:2px}
.rep .r{margin-left:auto;font-size:10.5px;color:var(--ink3);text-align:right;flex:none}
.post{background:#fff;border:1px solid var(--line);border-radius:13px;padding:11px 12px;margin-bottom:8px}
.post .ph2{display:flex;align-items:center;gap:7px;margin-bottom:6px}
.post .av{width:24px;height:24px;border-radius:50%;background:#F0E4D2;flex:none;display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--ink2)}
.post .nm3{font-size:12.5px;font-weight:700}.post .dt{font-size:10px;color:var(--ink3);margin-left:auto}
.post .bd2{font-size:13.5px;line-height:1.75}
.post.t{border-color:#E0C9CE;background:#FFFCFC}.post.t .nm3{color:var(--enji)}
.wl{background:#F6EFDF;border:1px solid #E8DFC8;border-radius:12px;padding:9px 11px;font-size:11px;color:var(--ink2);line-height:1.7;margin-top:8px}
.ta{width:100%;border:1px solid var(--line);border-radius:12px;background:#fff;padding:11px;font:inherit;
 font-size:13px;min-height:74px;resize:none;color:var(--ink);line-height:1.7}
/* ─── ひつじ したく ─── */
.gr{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.gr .c{background:#fff;border:1px solid var(--line);border-radius:11px;height:62px;display:flex;align-items:center;
 justify-content:center;font-size:9.5px;color:var(--ink2);text-align:center;line-height:1.35;cursor:pointer;padding:2px}
.gr .c.sel{border:2px solid var(--enji);color:var(--enji);font-weight:700}
.gr .c.no{color:#B9AA97;background:#FAF6EC}
.cols{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.cols i{display:block;padding-top:100%;border-radius:50%;border:1px solid rgba(38,25,19,.10);cursor:pointer}
.cols i.on{outline:2px solid var(--enji);outline-offset:2px}
.shelf{background:#fff;border:1px solid var(--line);border-radius:13px;padding:11px 12px;margin-bottom:8px;cursor:pointer}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:9px}
.slots .s{border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 0;text-align:center;font-size:10px;color:var(--ink2);cursor:pointer;min-height:44px;display:flex;flex-direction:column;justify-content:center;gap:2px}
.slots .s.on{border:2px solid var(--enji);color:var(--enji);font-weight:700}
.slots .s b{font-size:9px;color:var(--ink3);font-weight:400}
/* ─── しらべる（有料） ─── */
.lock{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:11px 0;border-bottom:1px solid var(--line2);font-size:13px;cursor:pointer;min-height:44px;color:#A0917F}
.lock:last-child{border:none}
.lk{font-size:10px;border:1px solid var(--line);border-radius:6px;padding:2px 6px;color:var(--ink3);flex:none}
/* ─── トグル ─── */
.sw{width:44px;height:26px;border-radius:99px;background:#DFD4BE;position:relative;flex:none;cursor:pointer;transition:.16s}
.sw i{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.16s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.sw.on{background:var(--enji)}.sw.on i{left:21px}
/* ─── 順番（しらべていること） ─── */
.ord{display:flex;align-items:center;gap:9px;padding:10px 0;border-bottom:1px solid var(--line2);font-size:12.5px}
.ord:last-child{border:none}
.ord .no{width:20px;height:20px;border-radius:50%;background:var(--enji);color:#fff;font-size:10.5px;display:flex;align-items:center;justify-content:center;flex:none}
.ord .no.g2{background:#EFE7D6;color:var(--ink3)}
.ord .up{margin-left:auto;font-size:15px;color:var(--ink3);cursor:pointer;padding:0 5px;flex:none}
/* ─── 4つの状態 ─── */
.sk{background:#F0E9DA;border-radius:8px;height:13px;margin-bottom:8px;animation:sk 1.4s ease-in-out infinite}
.sk.b{height:64px;border-radius:12px}
@keyframes sk{0%,100%{opacity:1}50%{opacity:.55}}
.empty{text-align:center;padding:26px 14px;background:#fff;border:1px dashed var(--line);border-radius:14px}
.empty .t{font-size:13.5px;line-height:1.8}.empty .s{font-size:11.5px;color:var(--ink2);margin-top:8px;line-height:1.8}
/* ─── 運営 ─── */
.opbar{background:#F1E9D9;border-bottom:1px solid var(--line);padding:8px 15px;font-size:11px;color:var(--ink2);line-height:1.6}
.role{font-size:10px;border:1px solid var(--line);border-radius:6px;padding:2px 7px;color:var(--ink2);background:#fff;flex:none}
.kpi{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:9px}
.kpi .k{background:#fff;border:1px solid var(--line);border-radius:13px;padding:11px 12px;cursor:pointer}
.kpi .k .v{font-size:22px;font-weight:700;letter-spacing:.02em}
.kpi .k .l{font-size:10.5px;color:var(--ink3);margin-top:2px}
.tbl{width:100%;border-collapse:collapse;font-size:11px}
.tbl th{background:#F3ECDD;color:var(--ink2);font-weight:400;padding:6px 5px;border:1px solid var(--line);font-size:10px;white-space:nowrap}
.tbl td{border:1px solid var(--line);padding:6px 5px;background:#fff;text-align:center;white-space:nowrap}
.tbl td.k{background:#FBF6EA;text-align:left;position:sticky;left:0;z-index:1}
.scr{overflow-x:auto;border-radius:12px;border:1px solid var(--line)}
.koma{background:#FFF;border-left:3px solid var(--enji);border-radius:5px;padding:3px 5px;font-size:9.5px;line-height:1.4;text-align:left}
.dup{border-left-color:var(--yama);background:#FBF3E2}
/* ─── シート ─── */
.mask{position:absolute;inset:0;background:rgba(38,25,19,.28);opacity:0;pointer-events:none;transition:.2s;z-index:5}
.mask.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--paper);border-radius:22px 22px 0 0;z-index:6;
 box-shadow:0 -10px 30px rgba(90,72,48,.2);padding:10px 15px 16px;transform:translateY(105%);transition:.23s cubic-bezier(.3,.9,.3,1);max-height:82%;overflow-y:auto}
.sheet.on{transform:translateY(0)}
.grab{width:40px;height:4px;border-radius:2px;background:#DFD4BE;margin:0 auto 12px}
.sht{font-size:16px;font-weight:700;margin-bottom:4px}
.toast{position:absolute;left:15px;right:15px;bottom:70px;background:#261913;color:#fff;border-radius:12px;
 padding:11px 13px;font-size:12px;z-index:8;opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none;display:flex;gap:10px;align-items:center}
.toast.on{opacity:1;transform:translateY(0)}   /* ★pointer-events は none のまま。ボタンを 塞がない */
.toast b{margin-left:auto;color:#F3C9CF;cursor:pointer;font-weight:400;pointer-events:auto}
.toast.on b{pointer-events:auto}
/* ─── デモ操作 ─── */
.demo{width:360px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px 13px}
.demo .t{font-size:11px;color:var(--ink3);letter-spacing:.1em;margin-bottom:8px}
.demo .r{display:flex;align-items:center;gap:6px;margin-bottom:7px;flex-wrap:wrap}
.demo .r>span.l{font-size:11px;color:var(--ink2);flex:0 0 62px}
.demo .pill{flex:none;white-space:nowrap}
/* ─── 全画面の おうち ─── */
.bd.full{padding:0}
.hroom{position:relative;width:100%;height:100%;min-height:660px;overflow:hidden;background:#F1E4CC}
.hroom svg{position:absolute;inset:0;width:100%;height:100%}
.hband{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;gap:8px;
 padding:9px 14px;background:linear-gradient(rgba(251,246,234,.92),rgba(251,246,234,0));z-index:3}
.hband h2{font-size:16px;letter-spacing:.06em}
.hband .m{font-size:11px;color:var(--ink2);margin-left:2px}
.hfab{position:absolute;right:14px;bottom:16px;z-index:9;background:var(--enji);color:#fff;
 border-radius:99px;padding:13px 24px;font-size:14px;font-weight:700;cursor:pointer;box-shadow:0 4px 12px rgba(90,72,48,.28)}
.hhit{position:absolute;z-index:2;cursor:pointer;border-radius:8px}
.hhit:active{background:rgba(255,255,255,.25)}
.hwalk{position:absolute;bottom:118px;left:0;width:126px;z-index:2;animation:walk 19s linear infinite}
.hwalk .bob{animation:bob .62s ease-in-out infinite;transform-origin:50% 100%}
.hwalk img{width:100%;display:block}
.hshadow{position:absolute;bottom:114px;left:0;width:104px;height:15px;margin-left:11px;border-radius:50%;
 background:rgba(120,98,66,.16);z-index:1;animation:walk 19s linear infinite}
/* ─── したくの 引き出し（3段） ─── */
#sheet.dr{max-height:62%;height:62%;padding:0;display:flex;flex-direction:column;overflow:hidden;border-radius:0}
.dr1{display:flex;border-bottom:1px solid var(--line);padding:0 8px}
.dr1 div{flex:1;text-align:center;font-size:10.5px;color:var(--ink2);padding:8px 2px 9px;cursor:pointer;line-height:1.4}
.dr1 div.on{color:var(--enji);font-weight:700;box-shadow:inset 0 -2px 0 var(--enji)}
.dr2{display:flex;gap:6px;overflow-x:auto;padding:8px 13px;border-bottom:1px solid var(--line2)}
.dr2 span{flex:none;border:1px solid var(--line);border-radius:99px;padding:4px 11px;font-size:10.5px;color:var(--ink2);background:#fff;cursor:pointer;white-space:nowrap}
.dr2 span.on{background:var(--enji);color:#fff;border-color:var(--enji)}
.dr3{display:flex;align-items:center;gap:8px;padding:8px 13px;font-size:11px;color:var(--ink2);border-bottom:1px solid var(--line2)}
.dr3 .sr{font-size:14px;cursor:pointer}
.dr3 .od{margin-left:auto;border:1px solid var(--line);border-radius:99px;padding:4px 11px;font-size:10.5px;background:#fff;cursor:pointer;white-space:nowrap;flex:none}
.drg{padding:10px 13px;overflow-y:auto;flex:1}
.g5{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.g5 .c{background:#fff;border:1px solid var(--line);border-radius:10px;aspect-ratio:1;display:flex;align-items:center;
 justify-content:center;font-size:8.5px;color:var(--ink2);text-align:center;line-height:1.3;cursor:pointer;padding:2px;position:relative}
.g5 .c.sel{border:1.6px solid var(--ink)}
.g5 .c.sel:after{content:'';position:absolute;right:4px;bottom:4px;width:6px;height:6px;border-radius:50%;background:var(--enji)}
.g5 .c.no{color:#C3B6A2;background:#FAF6EC}
.hcard{position:relative;border-radius:14px;overflow:hidden;height:290px;margin:0 -15px;border-bottom:1px solid var(--line)}
.hcard svg{position:absolute;inset:0;width:100%;height:100%}
.haichi{position:absolute;right:12px;bottom:12px;background:#FFFDF7;border-radius:99px;padding:9px 16px;
 font-size:12px;cursor:pointer;box-shadow:0 2px 8px rgba(90,72,48,.2);z-index:3}
.drt{display:flex;align-items:center;gap:8px;padding:9px 13px;border-top:1px solid var(--line2);background:#FDFAF3;font-size:13px}
.drt .x{margin-left:auto;border:1px solid var(--line);border-radius:9px;padding:7px 14px;font-size:12px;background:#fff;cursor:pointer}
.drt .k{border:0;border-radius:9px;padding:8px 18px;font-size:12.5px;font-weight:700;background:var(--enji);color:#fff;cursor:pointer}
.drr{display:flex;align-items:center;gap:5px;padding:6px 13px;background:#FDFAF3;overflow-x:auto}
.drr b{font-weight:400;font-size:10px;color:var(--ink3);flex:none;margin-right:2px;white-space:nowrap}
.drr .od{border:1px solid var(--line);border-radius:99px;padding:4px 10px;font-size:10.5px;background:#fff;cursor:pointer;white-space:nowrap;flex:none}
.drr i{flex:none;width:26px;height:26px;border-radius:5px;border:1px solid rgba(38,25,19,.10);cursor:pointer}
.drr i.on{outline:2px solid var(--ink);outline-offset:1px}
.drhint{padding:9px 13px;text-align:center;font-size:11.5px;color:var(--ink3);background:#FDFAF3;border-top:1px solid var(--line2)}
.drc{display:flex;gap:5px;overflow-x:auto;padding:7px 13px;border-top:1px solid var(--line2);background:#FDFAF3}
.drc i{flex:none;width:24px;height:24px;border-radius:50%;border:1px solid rgba(38,25,19,.10);cursor:pointer}
.drc i.on{outline:2px solid var(--enji);outline-offset:2px}
.drb{display:flex;border-top:1px solid var(--line);background:#FFFDF7}
.drb div{flex:1;text-align:center;font-size:12.5px;padding:13px 0;cursor:pointer;color:var(--ink2)}
.drb div.p{color:var(--enji);font-weight:700}
/* ─── 表・フォーム ─── */
.fl{font-size:10.5px;color:var(--ink3);letter-spacing:.08em;margin:12px 0 5px}
.inp{width:100%;border:1px solid var(--line);border-radius:12px;background:#fff;padding:12px;font:inherit;font-size:13.5px;color:var(--ink)}
.hm{display:grid;grid-template-columns:26px repeat(7,1fr);gap:3px;font-size:9.5px}
.hm b{font-weight:400;color:var(--ink3);text-align:center;align-self:center}
.hm i{display:block;padding-top:100%;border-radius:5px;cursor:pointer}
/* ─── 時間ピッカー（スワイプ） ─── */
.wheel{display:flex;justify-content:center;gap:4px;position:relative;height:132px;overflow:hidden}
.wheel:before{content:'';position:absolute;left:8px;right:8px;top:50px;height:32px;border-top:1px solid var(--line);
 border-bottom:1px solid var(--line);background:rgba(132,12,36,.045);border-radius:8px;pointer-events:none}
.wcol{height:132px;overflow-y:scroll;scroll-snap-type:y mandatory;width:66px;text-align:center;
 scrollbar-width:none;-ms-overflow-style:none}
.wcol::-webkit-scrollbar{display:none}
.wcol i{display:block;height:32px;line-height:32px;font-size:19px;font-style:normal;scroll-snap-align:center;color:var(--ink3)}
.wcol i.on{color:var(--ink);font-weight:700}
.wpad{height:50px}
.wlab{display:flex;justify-content:center;gap:4px;font-size:10px;color:var(--ink3)}
.wlab span{width:66px;text-align:center}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal b{font-weight:400;font-size:9.5px;color:var(--ink3);text-align:center}
.cal i{display:flex;align-items:center;justify-content:center;aspect-ratio:1;border-radius:8px;background:#fff;
 border:1px solid var(--line2);font-size:11px;font-style:normal;cursor:pointer;color:var(--ink2)}
.cal i.on{background:var(--enji);color:#fff;border-color:var(--enji);font-weight:700}
.cal i.mid{background:#F6E4E8;border-color:#EBD2D8;color:var(--enji)}
.cal i.no{color:#CFC3B0}
.paper{background:#fff;border:1px solid var(--line);border-radius:10px;padding:15px 14px;margin-bottom:9px}
.paper h4{font-size:12px;letter-spacing:.06em;border-bottom:1.5px solid var(--ink);padding-bottom:5px;margin-bottom:9px;font-weight:700}
.ptbl{width:100%;border-collapse:collapse;font-size:11px}
.ptbl th{text-align:left;font-weight:400;color:var(--ink3);border-bottom:1px solid var(--line);padding:4px 3px;font-size:10px;white-space:nowrap}
.ptbl td{border-bottom:1px solid var(--line2);padding:6px 3px;vertical-align:middle}
.ptbl td.r{text-align:right;white-space:nowrap}
.ptbl td.n{text-align:right;white-space:nowrap;font-weight:700}
.minibar{height:7px;background:var(--enji);border-radius:4px;display:block;opacity:.75}
.phead{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid var(--ink);padding-bottom:7px;margin-bottom:11px}
.phead .t{font-size:15px;font-weight:700}
.phead .s{font-size:10px;color:var(--ink3);text-align:right;line-height:1.6}
.chap{background:#fff;border:1px solid var(--line);border-radius:13px;margin-bottom:8px;overflow:hidden}
.chap .h{display:flex;align-items:center;gap:8px;padding:12px 13px;font-size:13px;cursor:pointer}
.chap .h s{margin-left:auto;font-size:10.5px;color:var(--ink3);text-decoration:none}
.chap .a{border-top:1px solid var(--line2);padding:2px 13px 6px}
.legend{max-width:600px;font-size:12.5px;color:var(--ink2);background:#fff;border:1px solid var(--line);
 border-radius:14px;padding:14px 16px;line-height:1.95}
.legend b{color:var(--enji)}.legend ul{margin:6px 0 0 1.2em}
.legend li{margin-bottom:3px}

function stateBlock(what,how){

  +'<div class="note">★ぐるぐるを 使いません。★灰色の 形を 置きます。★0.3秒 未満なら 何も 出しません。</div>';
 if(st==='空')return '<div class="empty"><div class="t">'+what+'</div><div class="s">'+how+'</div></div>'
  +'<div class="note">★白紙に しません。★「まだ ありません」だけで 終わりません。★何を すると 埋まるかを 1行 書きます。</div>';
 if(st==='失敗')return '<div class="card" style="background:#F6F1E4;border-color:#E8DFC8">'
  +'<div style="font-size:13px;line-height:1.8">いま つながりません。<br>書いたものは、この端末に 残っています。</div>'
  +'<div class="btn g" style="margin-top:10px" onclick="S.dm.st=\'ふつう\';draw()">もう一度</div></div>'
  +'<div class="note">★★書いたものを、失敗で 消しません。★これが いちばん重い決まりです。</div>';
 return null}
