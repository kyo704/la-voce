# ═══════════════════════════════════════════════
ALREADY_TRUE:   # ★★本番を 読み取りで 確かめました（★書き込んで いません）
  分かれている: |
    ★memberships（学校の 名簿）── user_id 必須。★見えるのは 本人と org の 権限持ち
    ★koen_members（公演の 名簿）── user_id は null 可。★見えるのは その 公演の 人だけ
    ★koen.org_id は null 可 ── ★学校に 属さない 公演も 作れます
  体調は誰にも見えない: |
    ★★entries（体調の 記録）の しばりは ★auth.uid() = user_id だけ。
    ★has_can(org_id,…) も koen_can_see(…) も ★入って いません。
    ★★学校からも 公演からも 見えません。抜け道は ありません。
  すでにそう作られていた: |
    ★★koen_members.name_at ＝『そのときの 呼び名』。
    ★これが『公演の 名簿は その公演かぎりの 紙』という 設計の 証拠です。
  本番の数: "★公演 0件 ／ 学校の 名簿 11人 ── ★まだ 誰も 使って いません。★いま 決めるのが よいです"

# ═══════════════════════════════════════════════
ADDED_SQL:   # ★sql/111（★試しの Postgres 16 で 通しました）
  koen_members.needs_account:
    WHY: "★①。★名前だけ 載せた 人は 稽古の 呼び出しが 届きません。★それが 分かるように"
  koen_members.from_roster:
    値: "student／teacher／outside"
    WHY: "★③。★どちらの 名簿から 写したかを 残します。★★つながって いる わけでは ありません"
  トリガ koen_member_keeps_name:
    WHY: "★⑤。★人が 抜けても ★名前は 残る。★名前の ない 行を 作らせません"
    VERIFIED: "★空の 名前 → NAME_REQUIRED"
  表 koen_slot_cast:
    WHY: |
      ★⑥。★いまの koen_cells は member_id が 1つしか 入らず ★A・B を 分けられません。
      ★★(slot_id, member_id, ab) に しました。★同じ人が いくつもの 役を 兼ねられます
    VERIFIED: "★スザンナ＝白石(A)・井上(B) ／ ★白石は バジリオ(A) も 兼ねる"
  関数 koen_member_calls(member):
    WHY: "★★これが『クリック一つ』の 中身。★その人の 出番を ★兼ね役ごと 1回で 返します"
    VERIFIED: "★白石 澪 → 1幕1場 スザンナ／1幕2場 スザンナ／1幕2場 バジリオ（★3行）"
  残すこと:
    - "★koen_members は 掃除（retention）の 対象では ありません ── ★④の とおり 残ります"
    - "★memberships の 削除は すでに has_can(org_id,'post') で できます ── ★⑤"
    - "★★消しても koen_members.name_at に 名前が 残ります（★確かめました）"

