<!doctype html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Woolsong 動く見本 ── PC・iPad</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--enji:#840C24;--yama:#8C6115;--midori:#447862;--paper:#FBF6EA;--card:#fff;
 --line:#E4DAC4;--line2:#F0E9DA;--ink:#261913;--ink2:#6D5D50;--ink3:#7C6C5E;--bg:#EFE7D6;
 --red:#B23A48;--sh:0 1px 0 rgba(0,0,0,.03),0 8px 24px rgba(90,72,48,.10)}
body{background:var(--bg);font-family:"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;color:var(--ink);
 display:flex;flex-direction:column;align-items:center;padding:20px 14px 50px;gap:12px;line-height:1.7}
h1{font-size:20px;letter-spacing:.04em}
.lead{font-size:12.5px;color:var(--ink2);max-width:900px;text-align:center;line-height:1.9}
/* ── 端末の 枠 ── */
.dev{background:#fff;border:1px solid #D9CDB4;border-radius:14px;box-shadow:var(--sh);overflow:hidden;
 display:flex;flex-direction:column;transform-origin:top center}
:root{--z:1}
/* 文字を 大きく（老眼対策）── 見える 大きさは 変えず、中の ものを 大きく します。
   zoom で 拡大し、その ぶん 幅を 割ります。だから 画面は はみ出しません。 */
.dev{zoom:var(--z)}
/* 大きくした ときは、横に 並べず 上下に します（表を 広く 使うため） */
.dev.big .col2{flex-direction:column}
.dev.big .col2>div{flex:1 1 auto!important;min-width:0!important;width:100%}
.dev.big .grid table.wk{min-width:0}
.dev.big .pane{flex-direction:column}
.dev.big .pane .lft{width:auto;max-height:230px;border-right:0;border-bottom:1px solid var(--line)}
.dev.pc{width:calc(1400px / var(--z));height:calc(880px / var(--z))}
.dev.ipadL{width:calc(1180px / var(--z));height:calc(830px / var(--z))}
.dev.ipadP{width:calc(830px / var(--z));height:calc(1120px / var(--z))}
/* ── 上のバー ── */
.top{flex:0 0 52px;background:var(--enji);color:#fff;display:flex;align-items:center;
 justify-content:space-between;padding:0 20px;font-size:14.5px;letter-spacing:.04em}
.top .l,.top .r{display:flex;align-items:center;gap:14px}
.top .back{border:1px solid rgba(255,255,255,.45);border-radius:8px;padding:5px 11px;font-size:12.5px;cursor:pointer}
.badge{background:rgba(255,255,255,.18);border-radius:7px;padding:4px 10px;font-size:12px}
.badge.w{background:#F0C24B;color:#4A3510;font-weight:700}
.rl{width:30px;height:30px;border-radius:50%;border:1px solid rgba(255,255,255,.45);
 display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;line-height:1}
.rl:hover{background:rgba(255,255,255,.18)}
/* ── 健康の線 ── */
.wall{flex:0 0 30px;background:#F6EFDF;border-bottom:1px solid var(--line);
 display:flex;align-items:center;padding:0 20px;font-size:12px;color:var(--ink2);gap:8px}
.wall i{width:7px;height:7px;border-radius:50%;background:var(--midori);display:block;flex:none}
.main{flex:1;display:flex;overflow:hidden}
/* ── 左のナビ ── */
.side{flex:0 0 190px;background:#FDF9F0;border-right:1px solid var(--line);padding:12px 0;overflow-y:auto}
.side .nv{padding:11px 20px;font-size:14.5px;color:var(--ink2);display:flex;align-items:center;gap:10px;cursor:pointer}
.side .nv:hover{background:#FBF6EA}
.side .nv.on{background:#fff;color:var(--enji);font-weight:700;box-shadow:inset 3px 0 0 var(--enji)}
.side .gp{font-size:10.5px;color:var(--ink3);letter-spacing:.14em;padding:16px 20px 6px}
.side .who{padding:12px 20px 14px;border-top:1px solid var(--line);margin-top:10px;font-size:11.5px;color:var(--ink2);line-height:1.8}
.body{flex:1;padding:18px 24px 24px;overflow-y:auto;background:var(--paper)}
h2{font-size:22px;margin-bottom:2px;letter-spacing:.03em}
.sub{font-size:12.5px;color:var(--ink2);margin-bottom:15px}
.h3{font-size:11px;color:var(--ink3);letter-spacing:.13em;margin:18px 0 8px}
.h3:first-child{margin-top:0}
/* ── 部品 ── */
.cards{display:flex;gap:12px;margin-bottom:16px}
.kpi{flex:1;background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px 15px;cursor:pointer}
.kpi:hover{border-color:#CFC0A4}
.kpi .t{font-size:12px;color:var(--ink2);margin-bottom:2px}
.kpi .v{font-size:30px;font-weight:700;letter-spacing:-.01em}
.kpi .v s{font-size:14px;font-weight:400;color:var(--ink2);text-decoration:none;margin-left:3px}
.kpi.al{border-color:#E7C2C6;background:#FDF6F6}.kpi.al .v{color:var(--red)}
.col2{display:flex;gap:16px;align-items:flex-start}
.col2>*{flex:1;min-width:0}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px}
.card.p0{padding:0 16px}
.li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;
 border-bottom:1px solid var(--line2);font-size:13.5px;cursor:pointer;min-height:44px}
.li:last-child{border:none}
.li s{color:var(--ink3);font-size:12px;text-decoration:none;text-align:right;flex:none}
.li:hover{color:var(--enji)}
.li.plain{cursor:default}.li.plain:hover{color:inherit}
.usu{font-size:11.5px;color:var(--ink3)}
.spt0{font-size:13px;font-weight:700;margin-bottom:3px}
.sh3{font-size:11px;color:var(--ink3);letter-spacing:.12em;margin:14px 0 5px}
.spt{width:100%;border-collapse:collapse;font-size:11px;line-height:1.65}
.spt th{background:#F3ECDD;color:var(--ink3);font-weight:400;text-align:left;padding:5px 7px;border:1px solid var(--line)}
.spt td{padding:5px 7px;border:1px solid var(--line);background:#fff;vertical-align:top}
.spt td.k{width:34%;font-weight:600;background:#FDFAF3}
.fbtn{display:inline-block;margin-top:14px;font-size:11.5px;color:var(--ink3);
 border:1px solid var(--line);border-radius:99px;padding:5px 12px;cursor:pointer;background:#fff}
.fbtn:hover{border-color:#CFC0A4;color:var(--ink2)}
.fbtn.on{color:var(--enji);border-color:#CFC0A4}
.note{font-size:11.5px;color:var(--ink2);line-height:1.9;margin-top:12px;
 background:#FDFAF3;border:1px dashed var(--line);border-radius:10px;padding:11px 13px}
.warn{background:#F6F1E4;border:1px solid #E8DFC8;border-radius:10px;padding:10px 13px;
 font-size:12px;color:var(--ink2);line-height:1.8;margin-bottom:12px}
.btn{display:inline-block;border:0;background:var(--enji);color:#fff;border-radius:10px;padding:11px 20px;
 font:inherit;font-size:13.5px;font-weight:700;text-align:center;cursor:pointer}
.btn.g{background:#fff;color:var(--ink);border:1px solid var(--line);font-weight:400}
.btn.sm{padding:8px 14px;font-size:12.5px}
.btn.w{display:block;width:100%}
.btn.mid{background:var(--midori)}
.pill{display:inline-block;border:1px solid var(--line);border-radius:99px;padding:6px 13px;font-size:12.5px;
 color:var(--ink2);background:#fff;cursor:pointer;white-space:nowrap}
.pill.on{background:var(--enji);color:#fff;border-color:var(--enji);font-weight:700}
.pill.sm{padding:4px 10px;font-size:11.5px}
.pills{display:flex;gap:7px;margin-bottom:12px;flex-wrap:wrap;max-width:100%;min-width:0}
.pill{max-width:100%}
.tag{display:inline-block;background:#F3ECDD;color:var(--ink2);border-radius:6px;padding:2px 8px;
 font-size:11px;margin-left:7px;white-space:nowrap}
.inp{width:100%;border:1px solid var(--line);border-radius:10px;background:#fff;padding:11px 12px;
 font:inherit;font-size:13.5px;color:var(--ink)}
.ta{width:100%;border:1px solid var(--line);border-radius:10px;background:#fff;padding:12px;
 font:inherit;font-size:13.5px;min-height:90px;resize:vertical;color:var(--ink);line-height:1.8}
.fl{font-size:11px;color:var(--ink3);letter-spacing:.1em;margin:14px 0 6px}
.sw{width:44px;height:26px;border-radius:99px;background:#DFD4BE;position:relative;flex:none;cursor:pointer;transition:.16s}
.sw i{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.16s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.sw.on{background:var(--enji)}.sw.on i{left:21px}
.empty{text-align:center;padding:32px 16px;background:#fff;border:1px dashed var(--line);border-radius:12px}
.empty .t{font-size:14px;line-height:1.8}.empty .s{font-size:12px;color:var(--ink2);margin-top:8px;line-height:1.8}
/* ── 表 ── */
.tblwrap{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:auto;max-height:560px}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:12.5px}
th{position:sticky;top:0;z-index:3;background:#F3ECDD;color:var(--ink2);font-weight:400;
 padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;font-size:11.5px}
td{padding:9px 10px;border-bottom:1px solid var(--line2);white-space:nowrap;vertical-align:middle}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}tr.click:hover td{background:#FDFAF3}
td.num,th.num{text-align:right}
.stick{position:sticky;left:0;background:#FBF6EA;z-index:2}
th.stick{z-index:4}
/* ── 日程の 表 ── */
.grid{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:auto;max-height:600px}
.grid table{font-size:11.5px}
/* 週の 表は、曜日の 幅を そろえます */
.grid table.wk{table-layout:fixed;width:100%;min-width:560px}
.grid table.wk th:first-child,.grid table.wk td:first-child{width:104px}
.grid td{padding:3px;border-right:1px solid var(--line2);height:56px;white-space:normal;vertical-align:top}
.grid th{text-align:center}
.koma{border-left:3px solid var(--enji);background:#FFFDF8;border-radius:5px;padding:4px 6px;
 font-size:10.5px;line-height:1.45;height:100%;cursor:pointer;position:relative}
.koma:hover{background:#FBF3F4}
.koma b{font-weight:700;display:block}
.koma.dup{border-left-color:var(--yama);background:#FBF3E2}
.koma.mine{border-left-color:var(--midori);background:#F4F8F5}
.koma.busy{border-left-color:#B5A78F;background:#EFE9DC;color:#7C6C5E;cursor:default}
.koma.now{border-left-color:var(--red);background:#F7E9EA;color:var(--red);cursor:default}
.koma.busy.priv{border-left-style:dotted;border-left-width:4px;background:#F4EFE4}
.koma.sel2{outline:2px solid var(--ink);outline-offset:-2px}
.koma .pv{display:inline-block;font-size:9px;border:1px solid #C9BCA6;border-radius:4px;padding:0 3px;color:#7C6C5E}
.slot{position:relative}
.slot .yt{position:absolute;right:2px;bottom:2px;font-size:9px;color:var(--ink3);border:1px solid var(--line);
 border-radius:4px;padding:0 3px;background:#fff;opacity:0;transition:.12s;white-space:nowrap}
.slot:hover .yt{opacity:1}
.slot .yt:hover{background:var(--yama);color:#fff;border-color:var(--yama)}
/* ══ 日程のカレンダー（ほかの カレンダーアプリと 同じ 組み方） ══ */
.cal{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.calh{display:flex;border-bottom:1px solid var(--line);background:#FBF8F1}
.calh .gut{flex:0 0 58px;border-right:1px solid var(--line2)}
.calh .dh{flex:1;min-width:0;text-align:center;padding:8px 2px 7px;border-right:1px solid var(--line2)}
.calh .dh:last-child{border-right:0}
.calh .dw{font-size:11px;color:var(--ink3);letter-spacing:.08em}
.calh .dd{font-size:19px;font-weight:600;line-height:1.25;margin-top:1px}
.calh .dh.tdy .dw{color:var(--enji)}
.calh .dh.tdy .dd{background:var(--enji);color:#fff;border-radius:50%;
 width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;font-size:16px}
.calb{display:flex;position:relative;max-height:560px;overflow-y:auto}
.calb .gut{flex:0 0 58px;position:relative;border-right:1px solid var(--line2);background:#FBF8F1}
.calb .hr{position:absolute;right:6px;font-size:10.5px;color:var(--ink3);transform:translateY(-6px)}
.col{flex:1;min-width:0;position:relative;border-right:1px solid var(--line2)}
.col:last-child{border-right:0}
.col.tdy{background:#FDFAF3}
.ln{position:absolute;left:0;right:0;border-top:1px solid var(--line2)}
.ln.half{border-top-style:dotted;opacity:.55}
.hit{position:absolute;left:1px;right:1px;cursor:pointer;border-radius:5px}
.hit:hover{background:#FBF6EA;outline:1px solid var(--line)}
.hit .hn2{position:absolute;left:5px;top:3px;font-size:10.5px;color:var(--ink3)}
.hit .yt2{position:absolute;right:4px;bottom:3px;font-size:9px;color:var(--ink3);border:1px solid var(--line);
 border-radius:4px;padding:0 4px;background:#fff;opacity:0;transition:.12s}
.hit:hover .yt2{opacity:1}
.hit .yt2:hover{background:var(--yama);color:#fff;border-color:var(--yama)}
.hit.on{outline:2px solid var(--ink);outline-offset:-2px;background:#FBF6EA}
.ev{position:absolute;left:2px;right:2px;border-radius:6px;padding:3px 6px;font-size:10.5px;
 line-height:1.35;overflow:hidden;cursor:pointer;border-left:3px solid var(--enji);background:#FFF7F8}
.ev b{display:block;font-weight:700;font-size:11px}
.ev.les{border-left-color:var(--midori);background:#EEF5F0}
.ev.sch{border-left-color:#B5A78F;background:#EFE9DC;color:#6D5D50}
.ev.own{border-left-color:#B5A78F;border-left-style:dotted;border-left-width:4px;background:#F4EFE4;color:#6D5D50}
.ev.on{outline:2px solid var(--ink);outline-offset:-2px}
.ev .tg{font-size:9px;border:1px solid currentColor;border-radius:4px;padding:0 3px;opacity:.75;margin-left:3px}
.now{position:absolute;left:0;right:0;height:0;border-top:2px solid var(--red);z-index:3}
.now::before{content:'';position:absolute;left:-4px;top:-4px;width:7px;height:7px;border-radius:50%;background:var(--red)}
.mini{background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 12px}
.mini .mh{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;margin-bottom:7px}
.mini .mg{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.mini .mg span{text-align:center;font-size:10px;color:var(--ink3);padding:2px 0}
.mini .mg b{text-align:center;font-size:11.5px;font-weight:400;padding:4px 0;border-radius:6px;cursor:pointer}
.mini .mg b:hover{background:#F3ECDD}
.mini .mg b.w{background:#F6E4E8}
.mini .mg b.t{background:var(--enji);color:#fff;font-weight:700}
.mini .mg b.o{color:#C9BCA6}

/* ── 週の 移動 ── */
.wknav{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:2px 0 8px;
 background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px 13px}
.wknav b{font-size:15px}
.wkstrip{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px}
.wkc{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:9px;
 padding:6px 11px;font-size:11.5px;color:var(--ink2);cursor:pointer;white-space:nowrap;position:relative}
.wkc:hover{border-color:#CFC0A4}
.wkc.on{background:var(--enji);color:#fff;border-color:var(--enji)}
.wkc i{font-style:normal;font-size:9px;margin-left:5px;color:var(--yama)}
.wkc.on i{color:#F0C24B}
.grid th.tdyh{background:#F6E4E8;color:var(--enji);font-weight:700}
.grid td.tdyc{background:#FDF7F8}
/* ── 予定の カード ── */
.yc{margin-top:14px;border-color:#CFC0A4}
.ych{display:flex;align-items:baseline;gap:10px;margin-bottom:4px;flex-wrap:wrap}
.ych b{font-size:14px}
.yrow{display:flex;gap:12px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line2)}
.ylab{flex:0 0 92px;font-size:11.5px;color:var(--ink3);padding-top:5px}
.ybox{flex:1;min-width:0}
.ybox .pills{margin-bottom:5px}
/* ── 凡例（短く・記号で） ── */
.lgd{display:flex;gap:16px;flex-wrap:wrap;margin-top:8px;font-size:11.5px;color:var(--ink2);align-items:center}
.lgd span{display:flex;align-items:center;gap:5px}
.lgd i{width:14px;height:14px;border-radius:4px;border:1px solid var(--line);display:inline-block}
.lgd i.sw1{background:#fff}
.lgd i.sw2{background:#F4F8F5;border-left:3px solid var(--midori)}
.lgd i.sw3{background:#F4EFE4;border-left:3px dotted #B5A78F}
.lgd i.sw4{background:#EFE9DC;border-left:3px solid #B5A78F}
.lgd i.sw5{background:#FBF3E2;border-left:3px solid var(--yama)}
.koma .pen{position:absolute;right:3px;top:2px;font-size:11px;color:var(--ink3);
 padding:1px 4px;border-radius:4px;cursor:pointer;background:#0000000d}
.koma .pen:hover{background:var(--ink);color:#fff}
.hdb{font-size:10px;color:var(--ink3);cursor:pointer;padding:1px 5px;border-radius:4px;
 border:1px solid var(--line);margin-left:4px;font-weight:400}
.hdb:hover{background:var(--ink);color:#fff;border-color:var(--ink)}
.slot{height:100%;border-radius:5px;display:flex;align-items:center;justify-content:center;
 font-size:12px;color:#C3B6A2;cursor:pointer}
.slot:hover{background:#FBF6EA;color:var(--enji)}
.slot.n{background:#fff;color:var(--ink2)}
.slot.sel{outline:2px solid var(--ink);outline-offset:-2px}
/* ── 2ペイン（連絡） ── */
.pane{display:flex;gap:0;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;height:620px}
.pane .lft{flex:0 0 292px;border-right:1px solid var(--line);overflow-y:auto;background:#FDFAF3}
.pane .rgt{flex:1;overflow-y:auto;padding:18px 22px}
.pane .rgt .inner{max-width:640px}
.pl{padding:13px 15px;border-bottom:1px solid var(--line2);cursor:pointer}
.pl:hover{background:#fff}
.pl.on{background:#fff;box-shadow:inset 3px 0 0 var(--enji)}
.pl .t{font-size:13.5px;display:flex;align-items:flex-start;gap:7px}
.pl .m{font-size:11px;color:var(--ink3);margin-top:3px;padding-left:14px}
.dot{width:7px;height:7px;border-radius:50%;background:#2E6FD9;flex:none;margin-top:6px}
.dot.off{background:none}
.post{border-bottom:1px solid var(--line2);padding:14px 0}
.post:last-child{border:0}
.post .ph2{display:flex;align-items:center;gap:9px;margin-bottom:6px}
.post .av{width:28px;height:28px;border-radius:50%;background:#F0E4D2;flex:none;display:flex;
 align-items:center;justify-content:center;font-size:11.5px;color:var(--ink2)}
.post .nm3{font-size:13px;font-weight:700}.post .dt{font-size:11px;color:var(--ink3);margin-left:auto}
.post .bd2{font-size:14px;line-height:1.85}
.wl{background:#F6EFDF;border:1px solid #E8DFC8;border-radius:10px;padding:10px 13px;
 font-size:11.5px;color:var(--ink2);line-height:1.8;margin-top:8px}
/* ── ヒートの 数 ── */
.hn{display:inline-block;min-width:22px;text-align:center;font-size:12px}
/* ── 下の 操作 ── */
.demo{width:100%;max-width:900px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 15px}
.demo .t{font-size:11px;color:var(--ink3);letter-spacing:.1em;margin-bottom:8px}
.demo .r{display:flex;align-items:center;gap:7px;margin-bottom:8px;flex-wrap:wrap}
.demo .r>span.l{font-size:11.5px;color:var(--ink2);flex:0 0 74px}
.demo .pill{flex:none}
.legend{max-width:900px;font-size:13px;color:var(--ink2);background:#fff;border:1px solid var(--line);
 border-radius:12px;padding:15px 18px;line-height:1.95}
.legend b{color:var(--enji)}.legend ul{margin:6px 0 0 1.3em}.legend li{margin-bottom:3px}
.toast{position:fixed;left:50%;transform:translateX(-50%) translateY(10px);bottom:26px;background:#261913;color:#fff;
 border-radius:11px;padding:12px 18px;font-size:13px;z-index:80;opacity:0;transition:.2s;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

 if(IMP.step===2){var M=impMap();

 if(IMP.step===4)return h

 return h

var EXP_YOKU=[
 ['名簿を 校務システムへ','一番 多い ぶん。年度はじめ・転入出のとき',

 ['レッスンの 日程と 出席','学期の 終わり・監査のとき',
  {what:['レッスンの 日程','レッスンの 出席'],fmt:'CSV',enc:'Shift_JIS',nl:'CRLF',date:'2026/09/14'}],
 ['行事を カレンダーへ','Google カレンダー・Outlook に そのまま 入ります',
  {what:['行事'],fmt:'iCalendar（.ics）'}],
 ['全部（Excel）','手もとで 見るとき。1つの zip で 出ます',
  {what:null,fmt:'Excel（.xlsx）'}]];
function expYoku(i){var y=EXP_YOKU[i][2];
 EXP.what=(y.what||expList()).filter(expCan);

 if(!EXP.what.length){toast('あなたの 役職では 出せません');return}
 EXP.view=EXP.what[0];draw();
 toast('「'+EXP_YOKU[i][0]+'」に そろえました。あとは「書き出す」を 押すだけです')}
function expDo(){
 if(!EXP.what.length){toast('何を 出すか 選んでください');return}
 EXP.what.forEach(function(w){
   var cols=EXP_COLS[w]||[],pre=PRESET[EXP.preset]||{};
   var L=[cols.map(function(c){return pre[c[1]]||c[0]})];
   for(var r=0;r<Math.min(expRows(w),200);r++)L.push(cols.map(function(c){return expSample(c[1])}));
   var csv='﻿'+L.map(function(r){return r.map(function(c){
     return '"'+String(c).replace(/"/g,'""')+'"'}).join(',')}).join(EXP.nl==='LF'?'\n':'\r\n');
   dlBlob(csv,expFile(w).split('　')[0],'text/csv;charset=utf-8')});
 toast(EXP.what.length+'つの ファイルを 書き出しました（誰が いつ 何を 出したかが 残ります）')}
function stExport(){
 if(EXP.detail===undefined)EXP.detail=0;
 EXP.what=EXP.what.filter(expCan);
 if(!EXP.what.length&&expList().length)EXP.what=[expList()[0]];
 if(EXP.what.indexOf(EXP.view)<0)EXP.view=EXP.what[0]||expList()[0]||'名簿';
 var cols=EXP_COLS[EXP.view]||[],pre=PRESET[EXP.preset]||{};
 var chip=function(k,v){return '<span class="pill sm '+(EXP[k]===v?'on':'')+'" onclick="EXP.'+k+'=\''+esc(v)+'\';draw()">'+v+'</span>'};
 var total=EXP.what.reduce(function(a2,w){return a2+expRows(w)},0);
 return '<div class="h3" style="margin-top:0">書き出す（校務システムへ）</div>'

 +'<div class="card p0" style="max-width:640px">'+EXP_YOKU.map(function(y,i){

 +'<span class="btn g sm" onclick="EXP.detail=EXP.detail?0:1;draw()">'

 +'<div class="usu" style="margin-bottom:6px">いま　'+EXP.fmt+(EXP.fmt==='CSV'?'　'+EXP.enc+'　'+EXP.nl:'')+'　／　見出し '+EXP.preset+'</div>'

function autoAll(){
 var A=AUTO;

 var slots=[];
 DAYS.forEach(function(d,di){myKoma().forEach(function(k,ki){
   if(A.offDay[di]||A.offKoma[ki])return;
   if(TBUSY[di+'-'+ki])return;
   slots.push({d:di,k:ki,key:di+'-'+ki})})});
 slots.sort(function(x,y){return A.dir==='早い順'?(x.k-y.k)||(x.d-y.d):(y.k-x.k)||(x.d-y.d)});
 /* ② 置く 順番 */
 var order=MONKA.map(function(m,i){return i});
 if(A.order==='空きが 少ない方から')order.sort(function(a,b){
   var f=function(i){var n=0;slots.forEach(function(s){if(isFree(i,s.key))n++});return n};
   return f(a)-f(b)});
 else order.sort(function(a,b){var d=gakuIdx(MONKA[a][1])-gakuIdx(MONKA[b][1]);
   return A.order==='上級生から'?-d:d});
 /* ③ 置く */

 var usedDays=function(){var o={};Object.keys(PLACED).forEach(function(k){o[k.split('-')[0]]=1});return o};
 var runOK=function(di,ki){
   /* 続けて 入れる 上限と、そのあとの 休みを 見ます */
   var run=1,i;
   for(i=ki-1;i>=0;i--){if(PLACED[di+'-'+i])run++;else break}

   if(run>A.runMax)return false;
   if(A.restAfter>0){
     /* 直前に 上限まで 続いていたら、休みを 空ける */
     var prev=0;for(i=ki-1;i>=0;i--){if(PLACED[di+'-'+i])prev++;else break}
     if(prev>=A.runMax)return false;
     var gap=0;for(i=ki-1;i>=0&&gap<A.restAfter;i--){if(!PLACED[di+'-'+i])gap++;else break}
     var before=0;for(var j=ki-1-gap;j>=0;j--){if(PLACED[di+'-'+j])before++;else break}
