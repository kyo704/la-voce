DOC: "公演の『お金』― 予算・精算・チケットの値段の提案（設計の提案）"
DATE: 2026-09-25（第2版：坂本さんの決定「すべての収支を扱う」を反映。個人ごとの出演料も持つ）
AUTHOR: Fable
FOR: Opus（判断）・坂本さん
CONTEXT: "坂本さんの希望：収支決算と予算配分／チケットの妥当な値段を自動で提案（無料も自由も可）／会計ソフトに学んで公演のための便利を盛り込む。2027-07 の公演の販売の後に作る前提"
PRINCIPLE: "公演のすべての収支を、この中で完結できる（予算→明細→支払い予定→精算→報告→会計ソフトへ）。ただし『お金を動かさない』：決済・送金・チケット販売はしない。個人ごとの出演料は通常の個人情報として持つ（要配慮個人情報ではない）。見られる人を狭く、目的を限る"

# ---------------------------------------------------------------
LEARNED_FROM_ACCOUNTING:   # 会計ソフト（freee／マネーフォワード等）と制作の実務から取り出した原理
  - "予算と実績は同じ表の2列。差額は自動。項目は増やせるが、既定の科目がある"
  - "取引には日付・相手・金額・科目・メモ。写真の領収書は会計ソフトの仕事。ここでは金額と日付と科目だけ"
  - "損益分岐＝固定費 ÷（単価 − 変動費）。公演では『席数×入場率×単価』が収入の本体"
  - "レポートは『1枚』：収支の表・積み上げの図・差額の理由。助成金の報告書はこの1枚の言い換え"
  - "税は触らない：税込で入力し、税の区分は会計ソフトへ渡してから"
  - "『前回から複製』が最大の時短。公演は毎回似ている"

# ---------------------------------------------------------------
FEATURES:   # 便利の一覧。★＝最初に出す
  BUDGET:
    - "★ 収入と支出の見取り図：区分（収入：チケット・助成・協賛・会費・物販／支出：会場・出演・オーケストラ・舞台美術・衣裳・照明音響・広報・印刷・事務・予備）× 見込み／実績。合計・差額は自動"
    - "★ 既定の科目は公演の種類（オペラ・演劇・ミュージカル・オーケストラ・合唱・ガラ・バンド・ダンス）ごとに違う。作品の雛形と同じ発想"
    - "★ 前回の公演から複製（金額は空にも、そのままにも）"
    - "支払いの期日の一覧（会場の前金・保険・印刷）。催促はしない。期日で書く"
    - "予備費の目安：支出の5〜10%（既定8%）を自動で1行"
    - "『何が増えたか』：実績が見込みを超えた項目だけを上に"
  DETAILS:   # 明細（すべての収支）
    - "★ 明細の入力：日付・相手（出演者・スタッフ・業者・助成元）・科目・金額（税込）・支払い予定日・状態（予定／支払い済／入金済）・メモ・領収書の写真（1枚）"
    - "★ 出演者・スタッフごとの出演料と交通費：香盤表の名簿から相手を選ぶ（二重入力しない）。合計は見取り図の『出演』へ自動"
    - "★ 立替の一覧：誰がいくら立て替え、いつ精算するか。精算した印を押す（送金はしない）"
    - "入金の一覧：助成・協賛・チケット（回数ごとの売上を手で入力、またはCSV取込）"
    - "支払い予定の一覧：期日順。催促はしない、色も使わない。期日で書く"
    - "★ 前回から複製は明細の相手と科目も引き継ぐ（金額は空）"
  TAX_HELP:   # 計算の補助まで。申告はしない
    - "報酬の源泉徴収（10.21%／同一人に100万円超の部分は20.42%）の計算と、支払調書の一覧（年・相手・支払額・源泉額）。★注意書き：税理士に確認を"
    - "税込入力。税率の区分（10%／軽減／対象外）は会計ソフトへ渡してから。消費税の計算はしない"
    - "インボイス：相手の登録番号の有無を明細に記録できる（発行はしない）"
  TICKET_PRICE:
    - "★ 席数と想定入場率（既定：小ホール70%・中80%・大60%。本人が変えられる）から損益分岐の単価を出す"
    - "★ 3つの案を並べる：『無料』（収入0で、支出は助成・協賛・会費で賄う。不足額を示す）／『採算』（分岐点＋予備費）／『余裕』（採算×1.2、次の公演の元手）。★自由入力はいつでも"
    - "★ 相場の物差し：同じ種類・同じ規模の公演の価格帯（Woolsong内の公演から匿名で集計。5件未満は出さない）。無い間は既定の幅（例：市民オペラ 3,000〜6,000）"
    - "席種：S/A/B・学生・早割・当日の差を、比率（例：S=1.4、学生=0.5）で一括に。1席種でも可"
    - "感度：入場率が10%落ちたら／助成が取れなかったら、いくら変わるか。1行で"
    - "やらない：空席に応じた値上げ・値下げ（ダイナミックプライシング）。相場より高い/安いの『評価』を色で出さない"
  INCOME_SCENARIOS:
    - "入場率3段（弱・中・強）で収入と差額を並べる。既定は中"
    - "助成・協賛は『申請中／確定』の2段。確定だけを採算に入れる"
  SETTLEMENT:
    - "★ 精算の1枚：収支の表・積み上げの図・差額の理由（本人が書く）・入場者数。PDF"
    - "助成金の報告書の形（文化庁・自治体・財団の多くは『収支決算書』が同じ形）に合わせた出力。項目名の対応表を持つ"
    - "共同主催の按分：割合を決めれば各社の負担額。ただし請求書は出さない"
  EXPORT:
    - "★ CSV（日付・科目・相手・金額・メモ）で会計ソフトへ。freee／マネーフォワードの取込の列名に合わせた2形式"
    - "予算の表をExcel（xlsx）で。稟議に貼る"
  PERMISSIONS:
    - "見られるのは制作の『post』札を持つ人だけ。出演者・学校・先生には見せない（学校が主催でも、学校の事務は『会場費と請求人数』まで＝その57の結合禁止に準じる）"
    - "出演者本人は『自分の出演料と支払い予定』だけを自分の画面で見られる（透明性。他人の分は見えない）。制作者がオンにしたときだけ"
    - "個人ごとの出演料は通常の個人情報として扱う：利用目的に『公演の収支の管理』を明記、保存は公演の精算から2年（制作者が延ばせる。帳簿の保存義務は制作者側で、会計ソフトへ渡したものが正）"
  NOT_DOING:
    - "お金を動かすこと：決済・送金・立替金の振込・チケットの販売（外部：チケットぴあ等へのリンクは公演ページに置ける）"
    - "税の申告・インボイスの発行（計算の補助と一覧までは行う。下の TAX_HELP）"
    - "会計ソフトとの双方向同期（CSVの片方向だけ）"

# ---------------------------------------------------------------
TICKET_MATH:   # 実装の式
  BREAK_EVEN_PRICE: "(支出合計 + 予備費 − 確定した助成 − 確定した協賛 − 会費収入) ÷ (席数 × 想定入場率 × 公演回数)"
  SEAT_TYPES: "基準価格 × 係数（S 1.4／A 1.0／B 0.7／学生 0.5／早割 0.85）。係数は本人が変えられる。席種ごとの席数で加重して分岐点を再計算"
  FREE_OPTION: "価格0。不足額＝支出合計 − 収入（助成・協賛・会費）。『不足はどこから出すか』を1行で聞く（自己負担／寄付／未定）"
  ROUNDING: "100円単位に丸める。3,000／3,500 のように"
  DISPLAY: "3案を横に並べ、数字は大きく、色は使わない（信号色を使わない原則）。『採算』を既定で選ぶが、どれも押せる。自由入力は上の欄にいつでも"
  EMPTY: "支出が未入力なら、案は出さない（嘘の値段を出さない）"

# ---------------------------------------------------------------
UI:
  ENTRY: "公演の中の『お金』タブ（post札のみ）。左：見取り図（表）、右：チケットの3案と感度"
  MOBILE: "表は縦に。3案は縦に3枚"
  FIRST_RUN: "『前回から複製』か『種類の既定から始める』の2択。空の表から始めない"
  PRINT: "精算の1枚と予算の表は印刷用の見た目を持つ（稟議・報告に）"

LEDGER:
  - "production_money_entries（production_id, on_date, side, category, counterparty_kind: member|staff|vendor|funder, member_id nullable, counterparty_name, amount, due_on, status: planned|paid|received, note, receipt_photo_id, withholding_amount, invoice_number）"
  - "production_budget_items（production_id, side: income|expense, category, label, planned, actual, due_on, status: draft|confirmed, note）"
  - "production_ticket_plan（production_id, seats, occupancy, shows, base_price, seat_types jsonb, chosen: free|breakeven|margin|manual, manual_price）"
  - "production_money_view（見取り図と分岐点の計算。RLS は post 札）"
  - "相場の集計は匿名の view（5件未満は NULL）"

EFFORT: "見取り図＋明細＋支払い予定＋精算の1枚＋CSV：3週間。チケットの3案・席種・感度：＋1週間。源泉・支払調書・報告書の形：＋1週間。相場の集計：公演が30本を超えてから"
WHEN: "公演の販売（2027-07）の後、実際の公演3本で困りごとを聞いてから着手。順番は『見取り図→チケットの案→精算→CSV』"

DECISIONS_FOR_OPUS:
  - "個人ごとの出演料を持つことの承認（通常の個人情報。利用目的の追記・保存2年・post札のみ・本人は自分の分だけ）"
  - "『お金を動かさない』（決済・送金・販売なし）を裁定にできるか"
  - "源泉徴収の計算と支払調書の一覧を出すか（税理士確認の注意書きつき）"
  - "相場の集計（Woolsong内の公演から匿名で・5件未満は出さない）を認めるか"
  - "学校が主催の公演で、学校の事務がお金の内訳を見られない（会場費と人数まで）でよいか"
