    - "F-M2a 席種なし（1席種）：要る額＝支出×(1+予備費率)＋取り分−確定助成−確定協賛−会費。単価＝要る額÷（席数×入場率×回数）を100円単位に★切り上げ（裁定201：切り上げ。四捨五入ではない）。期待値：支出1,200,000／予備8%／助成300,000／会費380,000／500席60%1回／取り分0 → とんとん2,100・不足616,000。取り分200,000 → 2,700（sql/88 の例のとおり）"
    - "F-M2b ★席種あり：席ごとの席数と係数（S 1.4／A 1.0／B 0.7／学生 0.5／早割 0.85）で『有効席数』＝Σ(席数_i × 係数_i)×入場率×回数 を出し、基準単価＝要る額÷有効席数（切り上げ）。見込める収入＝Σ(基準単価×係数_i×席数_i×入場率×回数)。手元＝収入−要る額。★席種を無視して基準単価×全席で計算してはならない（実際より多い手元を見せる誤り）。期待値の例：S 100席・A 250席・B 150席・取り分0 → 有効席数＝(140+250+105)×0.6＝297 → 基準単価＝616,000÷297＝2,074→2,100。収入＝2,100×297＝623,700。手元＝7,700（1席種の計算だと 2,100×300−616,000＝14,000 になり、多く見える）"
