<!doctype html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Woolsong 動く見本</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--enji:#840C24;--yama:#8C6115;--midori:#447862;--paper:#FBF6EA;--card:#fff;
 --line:#E4DAC4;--line2:#F0E9DA;--ink:#261913;--ink2:#6D5D50;--ink3:#7C6C5E;--bg:#EFE7D6}
body{background:var(--bg);font-family:"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;color:var(--ink);
 display:flex;flex-direction:column;align-items:center;padding:24px 14px 50px;gap:14px;line-height:1.7}
h1{font-size:19px;letter-spacing:.04em}
.lead{font-size:12.5px;color:var(--ink2);max-width:560px;text-align:center;line-height:1.9}
.ph{width:360px;height:812px;background:var(--paper);border-radius:30px;border:1px solid #DFD4BE;
 box-shadow:0 1px 0 rgba(0,0,0,.03),0 10px 30px rgba(90,72,48,.14);overflow:hidden;
 display:flex;flex-direction:column;position:relative}
.st{flex:0 0 26px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;font-size:9.5px;color:var(--ink3);letter-spacing:.08em}
.bd{flex:1;overflow-y:auto;padding:0 15px 18px}
.tabs{flex:0 0 56px;border-top:1px solid var(--line);display:flex;background:#FFFDF7}
.tb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-size:10px;color:var(--ink3);cursor:pointer}
.tb i{width:16px;height:2px;background:transparent;border-radius:2px;display:block}
.tb.on{color:var(--enji);font-weight:700}.tb.on i{background:var(--enji)}
.hd{display:flex;align-items:center;justify-content:space-between;padding:10px 1px 6px}
.hd h2{font-size:17px;letter-spacing:.06em}
.gear{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);display:flex;align-items:center;
 justify-content:center;color:var(--ink2);font-size:12px;cursor:pointer;background:#fff}
.h3{font-size:10.5px;color:var(--ink3);letter-spacing:.12em;margin:14px 0 7px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 13px;margin-bottom:9px}
.mini{font-size:11.5px;color:var(--ink2)}
.usu{font-size:11px;color:var(--ink3);margin-top:2px}
.note{font-size:11px;color:var(--ink2);line-height:1.85;margin-top:9px}
.warn{background:#F6F1E4;border:1px solid #E8DFC8;border-radius:12px;padding:9px 11px;font-size:11px;color:var(--ink2);line-height:1.75;margin-bottom:10px}
.seg{display:flex;background:#F3ECDD;border-radius:11px;padding:3px;margin:2px 0 10px}
.seg div{flex:1;text-align:center;font-size:11.5px;padding:8px 0;border-radius:9px;color:var(--ink2);cursor:pointer}
.seg div.on{background:#fff;color:var(--enji);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.pill{display:inline-block;border:1px solid var(--line);border-radius:99px;padding:7px 12px;font-size:11.5px;color:var(--ink2);background:#fff;cursor:pointer}
.pill.on{background:var(--enji);color:#fff;border-color:var(--enji);font-weight:700}
.pills{display:flex;gap:6px;margin-bottom:11px;flex-wrap:wrap}
.li{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--line2);font-size:13px;cursor:pointer;min-height:44px}
.li:last-child{border:none}
.li s{color:var(--ink3);font-size:11.5px;text-decoration:none;text-align:right}
.btn{display:block;width:100%;border:0;background:var(--enji);color:#fff;border-radius:13px;padding:14px 0;
 font:inherit;font-size:15px;font-weight:700;text-align:center;cursor:pointer}
.btn.g{background:#fff;color:var(--ink);border:1px solid var(--line);font-weight:400;font-size:13.5px;padding:12px 0}
.two{display:flex;gap:9px}.two>*{flex:1}
.rowb{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.rowb s{width:30px;font-size:9.5px;color:var(--ink3);text-decoration:none;flex:none}
.bar{height:8px;border-radius:4px;background:var(--enji)}
/* 気になったこと */
.mk{margin-top:2px}
.mkrow{display:flex;align-items:center;gap:6px;margin-bottom:5px}
.mkrow .nm{flex:0 0 96px;font-size:10.5px;color:var(--ink2);line-height:1.3}
.mkrow .cells{flex:1;display:flex;gap:2px}
.mkrow .cells i{flex:1;height:15px;border-radius:3px;background:#F0E9DA;display:block}
.mkrow .cells i.on{background:var(--enji);opacity:.85}
.mkrow .n{flex:0 0 30px;text-align:right;font-size:10px;color:var(--ink3)}
.mkx{display:flex;gap:2px;margin:2px 0 0 102px;font-size:8.5px;color:var(--ink3)}
.mkx span{flex:1;text-align:center}
.wk{display:flex;align-items:flex-end;gap:2px;height:30px}
.wk i{flex:1;background:var(--enji);border-radius:2px 2px 0 0;display:block;opacity:.85}
/* ノート */
.nt{background:#fff;border:1px solid var(--line);border-radius:13px;padding:12px 13px;margin-bottom:8px;cursor:pointer}
.nt .t{font-size:13.5px;line-height:1.7}
.nt .m{font-size:10.5px;color:var(--ink3);margin-top:6px}
.rep{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:13px;padding:11px 12px;margin-bottom:8px;cursor:pointer}
.rep .t{font-size:14px;font-weight:700}.rep .s{font-size:10.5px;color:var(--ink3);margin-top:2px}
.rep .r{margin-left:auto;font-size:10.5px;color:var(--ink3);text-align:right}
.tag{display:inline-block;background:#F3ECDD;color:var(--ink2);border-radius:6px;padding:2px 7px;font-size:10px;margin-left:6px}
.post{background:#fff;border:1px solid var(--line);border-radius:13px;padding:11px 12px;margin-bottom:8px}
.post .ph2{display:flex;align-items:center;gap:7px;margin-bottom:6px}
.post .av{width:24px;height:24px;border-radius:50%;background:#F0E4D2;flex:none;display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--ink2)}
.post .nm3{font-size:12.5px;font-weight:700}.post .dt{font-size:10px;color:var(--ink3);margin-left:auto}
.post .bd2{font-size:13.5px;line-height:1.75}
.post.t{border-color:#E0C9CE;background:#FFFCFC}.post.t .nm3{color:var(--enji)}
.wl{background:#F6EFDF;border:1px solid #E8DFC8;border-radius:12px;padding:9px 11px;font-size:11px;color:var(--ink2);line-height:1.7;margin-top:8px}
.room{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.shelf{background:#fff;border:1px solid var(--line);border-radius:13px;padding:11px 12px;margin-bottom:8px;cursor:pointer}
.gr{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.gr .c{background:#fff;border:1px solid var(--line);border-radius:11px;height:60px;display:flex;align-items:center;
 justify-content:center;font-size:9.5px;color:var(--ink3);text-align:center;line-height:1.3;cursor:pointer}
.gr .c.sel{border:2px solid var(--enji);color:var(--enji);font-weight:700}
.dots{display:flex;gap:6px}
.dots div{flex:1;border:1px solid var(--line);border-radius:11px;padding:10px 0 8px;text-align:center;font-size:11.5px;color:var(--ink2);background:#FDFAF3;cursor:pointer;min-height:44px}
.dots div .d{display:block;width:13px;height:13px;border-radius:50%;margin:0 auto 5px;background:var(--enji)}
.dots div.on{border:2px solid var(--enji);color:var(--enji);font-weight:700;padding:9px 0 7px;background:#fff}
.mask{position:absolute;inset:0;background:rgba(38,25,19,.28);opacity:0;pointer-events:none;transition:.2s;z-index:5}
.mask.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--paper);border-radius:22px 22px 0 0;z-index:6;
 box-shadow:0 -10px 30px rgba(90,72,48,.2);padding:10px 15px 16px;transform:translateY(105%);transition:.23s cubic-bezier(.3,.9,.3,1);max-height:78%;overflow-y:auto}
.sheet.on{transform:translateY(0)}
.grab{width:40px;height:4px;border-radius:2px;background:#DFD4BE;margin:0 auto 12px}
.legend{max-width:560px;font-size:12.5px;color:var(--ink2);background:#fff;border:1px solid var(--line);
 border-radius:14px;padding:14px 16px;line-height:1.95}
.legend b{color:var(--enji)}.legend ul{margin:6px 0 0 1.2em}
.back{font-size:12.5px;color:var(--enji);cursor:pointer;padding:8px 0;display:inline-block}
</style></head><body>
<h1>Woolsong ── 動く見本</h1>
<p class="lead">下のタブと、画面の中の切替・行を 押してください。★中身は 画面ごとに 別のものが 入っています。</p>
<div class="ph">
 <div class="st"><span>9:41</span><span>●●● ▮</span></div>
 <div class="bd" id="bd"></div>
 <div class="tabs" id="tabs"></div>
 <div class="mask" id="mask"></div>
 <div class="sheet" id="sheet"><div class="grab"></div><div id="sh"></div></div>
</div>
<div class="legend" id="lg"></div>
<script>
/* ---------- データ（90日ぶん） ---------- */
var MK=['のどが いがらっぽい','せきばらい','のどが 渇く','鼻が つまる','肩が こわばる','胃が もたれる'];
var DAY=[];(function(){var s=20260610;
 for(var i=89;i>=0;i--){var d=new Date(2026,8,9);d.setDate(d.getDate()-i);
  var r=function(n){s=(s*9301+49297)%233280;return s/233280*n};
  var marks=MK.filter(function(){return r(1)<0.16});
  DAY.push({d:d,voice:[3,2,1][Math.floor(r(3))],sing:30+Math.floor(r(9))*15,
   sleep:5.5+r(3),marks:marks,hard:r(1)<0.28});}
})();
function md(d){return (d.getMonth()+1)+'/'+d.getDate()}
function last(n){return DAY.slice(-n)}

/* ---------- 状態 ---------- */
var S={tab:'ふりかえる',fk:'ならべる',span:14,note:'稽古',hj:'ながめる',rep:null,mk:null};
var TABS=['きょう','記録','ふりかえる','ノート','ひつじ'];
function $(s){return document.querySelector(s)}
function go(t){S.tab=t;draw()}
function seg(list,cur,fn){return '<div class="seg">'+list.map(function(x){
 return '<div class="'+(x===cur?'on':'')+'" onclick="'+fn+'(\''+x+'\')">'+x+'</div>'}).join('')+'</div>'}

/* ---------- きょう ---------- */
function S_kyou(){return '<div class="hd"><h2>きょう</h2><div class="gear" onclick="sheet(\'motto\')">⚙</div></div>'
 +'<div class="card" style="text-align:center;padding:16px 13px"><div style="font-size:14px;line-height:1.8">きょうも 来てくれて ありがとう</div>'
 +'<div class="usu">羊は、記録した行為に 反応します</div></div>'
 +'<div class="h3">きょうの よてい</div><div class="card" style="padding:4px 12px">'
 +'<div class="li"><span>16:00　声楽A　斎藤先生</span><s>第1教室</s></div>'
 +'<div class="li"><span>19:00　自主練</span><s>第3練習室</s></div></div>'
 +'<div class="h3">近い 行事</div><div class="card" style="padding:4px 12px">'
 +'<div class="li" onclick="sheet(\'gyoji\')"><span>9月14日　実技試験</span><s>出ます ›</s></div></div>'
 +'<div class="btn" style="margin-top:14px" onclick="go(\'記録\')">きょうを 記録する</div>'
 +'<div class="note">★点数も、きょうの調子の 判定も 出しません。<br>★羊を 押しても 何も 起きません。</div>'}

/* ---------- 記録 ---------- */
var R={muku:null,nodo:null,deki:null};
function S_kiroku(){return '<div class="hd"><h2>記録</h2></div>'
 +'<div class="h3">あさ</div>'
 +dots('muku','起きたときの むくみ',['ない','すこし','ある'])
 +row('昨夜の 睡眠','7時間30分（23:30→7:00）')
 +'<div class="h3">よる</div>'
 +dots('nodo','のどの 調子',['よい','ふつう','わるい'])
 +dots('deki','声の 出来',['出た','ふつう','出づらい'])
 +row('本番以外で 声を使った時間','1時間30分')
 +'<div class="warn" style="margin-top:9px">湿度は こちらで 取ります。本番・レッスンの 翌日かどうかも、予定から 分かります。</div>'
 +'<div class="h3">足す（どれも 任意）</div>'
 +row('本番・レッスン','')+row('食べたもの','')+row('からだのこと','')+row('ひとこと','')
 +'<div class="note">★「○/5」を 出しません。★書かなかった行に 印を つけません。</div>'}
function dots(k,t,L){return '<div class="card"><div class="mini" style="margin-bottom:9px">'+t+'</div><div class="dots">'
 +L.map(function(v,i){return '<div class="'+(R[k]===v?'on':'')+'" onclick="pick(\''+k+'\',\''+v+'\')">'
 +'<span class="d" style="opacity:'+[.92,.6,.3][i]+'"></span>'+v+'</div>'}).join('')+'</div></div>'}
function pick(k,v){R[k]=v;draw()}
function row(t,v){return '<div class="li" style="background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:9px">'
 +'<span><b style="color:'+(v?'var(--midori)':'var(--enji)')+';margin-right:8px">'+(v?'✓':'＋')+'</b>'+t+'</span><s>'+(v||'')+' ›</s></div>'}

/* ---------- ふりかえる ---------- */
function S_furi(){
 var body='<div class="hd"><h2>ふりかえる</h2><div class="gear" onclick="sheet(\'motto\')">⚙</div></div>'
  +seg(['ならべる','さかのぼる','くらべる','かぞえる'],S.fk,'setFk');
 if(S.fk==='ならべる')body+=narabe();
 if(S.fk==='さかのぼる')body+=sakanobo();
 if(S.fk==='くらべる')body+=kuraberu();
 if(S.fk==='かぞえる')body+=kazoeru();
 return body}
function setFk(v){S.fk=v;draw()}
function setSpan(v){S.span=+v;draw()}
function narabe(){
 var n=S.span,D=last(n),wk=n>=90;
 var h='<div class="warn">ここに出るのは、あなたが書いたことの 並びです。原因かどうかは 分かりません。</div>'
 +'<div class="pills">'+[14,28,90].map(function(v){return '<span class="pill '+(S.span===v?'on':'')+'" onclick="setSpan('+v+')">'+(v===14?'14日':v===28?'4週':'3か月')+'</span>'}).join('')+'</div>';
 /* こえのちょうし */
 h+='<div class="card"><div class="mini" style="margin-bottom:8px">こえの ちょうし</div>';
 if(n<=28){h+=D.map(function(x,i){var w=[40,65,88][x.voice-1];
   return '<div class="rowb"><s>'+(n<=14?md(x.d):(i%7===0?md(x.d):''))+'</s><div class="bar" style="width:'+w+'%;opacity:'+(0.5+x.voice*0.15)+'"></div></div>'}).join('');}
 else{h+='<div style="display:flex;align-items:flex-end;gap:2px;height:64px">'+D.map(function(x){
   return '<i style="flex:1;display:block;background:var(--enji);opacity:'+(0.35+x.voice*0.2)+';height:'+[35,62,92][x.voice-1]+'%"></i>'}).join('')+'</div>'
   +'<div class="usu" style="text-align:right">1本＝1日</div>';}
 h+='</div>';
 /* 気になったこと ── 項目ごとの行 */
 h+='<div class="card"><div class="mini" style="margin-bottom:9px">気になったこと</div><div class="mk">';
 MK.forEach(function(m){
  var days=D.map(function(x){return x.marks.indexOf(m)>=0});
  var cnt=days.filter(Boolean).length;
  if(n<=28){
   h+='<div class="mkrow"><span class="nm">'+m+'</span><span class="cells">'
    +days.map(function(b){return '<i class="'+(b?'on':'')+'"></i>'}).join('')
    +'</span><span class="n">'+cnt+'日</span></div>';
  }else{
   var W=[];for(var i=0;i<days.length;i+=7)W.push(days.slice(i,i+7).filter(Boolean).length);
   h+='<div class="mkrow"><span class="nm">'+m+'</span><span class="cells wk">'
    +W.map(function(c){return '<i style="background:'+(c?'#840C24':'#F0E9DA')+';height:'+(c?Math.round(30+c/7*70):8)+'%;opacity:'+(c?(0.4+c/7*0.55):1)+'"></i>'}).join('')
    +'</span><span class="n">'+cnt+'日</span></div>';
  }
 });
 h+='</div>';
 if(n<=14)h+='<div class="mkx">'+last(14).map(function(x,i){return '<span>'+(i%3===0?x.d.getDate():'')+'</span>'}).join('')+'</div>';
 h+='<div class="usu" style="margin-top:7px">'+(n<=28?'●＝その日 あった':'1本＝1週間。高さ＝その週に あった日数')+'</div></div>';
 h+='<div class="note">★項目ごとに 1行にしました。★色の濃さでは 何のことか 分かりません。<br>'
  +'★3か月にすると、日ごとを やめて 週ごとに します（★つぶれるからです）。</div>';
 return h}
function sakanobo(){
 var hd=DAY.filter(function(x){return x.hard}).slice(-6).reverse();
 return '<div class="note" style="margin:0 0 10px">出なかった日を 選ぶと、その前の3日に 書いたことが そのまま 出ます。</div>'
 +'<div class="card" style="padding:4px 12px">'+hd.map(function(x,i){
   return '<div class="li" onclick="sheet(\'saka'+i+'\')"><span>'+md(x.d)+'　出づらい と書いた日</span><s>前の3日 ›</s></div>'}).join('')+'</div>'
 +'<div class="note">★文章を 添えません。★確率も 割合も 出しません。</div>'}
function kuraberu(){
 return '<div class="warn">ここに出るのは、あなたが書いたことの 並びです。原因かどうかは 分かりません。</div>'
 +'<div class="card"><div class="mini">食べ終えてから 寝るまでの間</div>'
 +'<div class="pills" style="margin:8px 0 6px">'+['前の夜','前の日','2日まえ','その日の朝'].map(function(v,i){
   return '<span class="pill '+(i===0?'on':'')+'" style="padding:4px 9px;font-size:10.5px">'+v+'</span>'}).join('')+'</div>'
 +dotplot()
 +'<div class="usu">● 書いた日　　○ あとから書いた日　　- - - まんなか</div></div>'
 +'<div class="card" style="background:#F6F1E4;border-color:#E8DFC8"><div style="font-size:12.5px;line-height:1.75">まだ、はっきりした差は 見えていません。<br>'
 +'<span style="font-size:11px;color:var(--ink2)">出なかった日が 11日 たまりました。この形のまま つづけてください。</span></div></div>'
 +'<div class="note">★「あと◯日」を 出しません。★画面を 消しません。</div>'}
function dotplot(){
 var G=[3.2,4.1,3.8,4.6,2.9,5.1,3.5,4.3,3.0,4.8,3.9,2.7,4.4,3.6],B=[1.4,2.1,.9,1.8,2.6,1.2,3.1,1.6,2.3,.7,2.0];
 var H=150,W=300,sx=function(c,i){return c+((i*37)%29)-14},sy=function(v){return H-v/6*H};
 var p='';[0,2,4,6].forEach(function(v){p+='<line x1="34" y1="'+sy(v)+'" x2="300" y2="'+sy(v)+'" stroke="#F0E9DA"/>'
  +'<text x="30" y="'+(sy(v)+3)+'" font-size="8" fill="#7C6C5E" text-anchor="end">'+v+'時間</text>'});
 G.forEach(function(v,i){p+='<circle cx="'+sx(110,i)+'" cy="'+sy(v)+'" r="4" fill="#840C24" opacity=".8"/>'});
 B.forEach(function(v,i){p+='<circle cx="'+sx(230,i)+'" cy="'+sy(v)+'" r="4" '+(i===2||i===7?'fill="none" stroke="#840C24" stroke-width="1.4" opacity=".55"':'fill="#840C24" opacity=".8"')+'/>'});
 [[110,3.85],[230,1.8]].forEach(function(m){p+='<line x1="'+(m[0]-24)+'" y1="'+sy(m[1])+'" x2="'+(m[0]+24)+'" y2="'+sy(m[1])+'" stroke="#840C24" stroke-width="1.6" stroke-dasharray="4 3"/>'});
 p+='<text x="110" y="'+(H+13)+'" font-size="9.5" fill="#5E5045" text-anchor="middle">よく出た日 14日</text>';
 p+='<text x="230" y="'+(H+13)+'" font-size="9.5" fill="#5E5045" text-anchor="middle">出なかった日 11日</text>';
 return '<svg viewBox="0 0 310 '+(H+20)+'" width="100%" style="display:block">'+p+'</svg>'}
function kazoeru(){
 var H=[2,5,9,14,11,7,4,2],mx=14;
 return '<div class="h3" style="margin-top:2px">あなたの ふだん</div><div class="card" style="padding:4px 12px">'
 +'<div class="li"><span>食べ終えてから 寝るまで</span><s>2時間40分</s></div>'
 +'<div class="li"><span>寝た 時刻</span><s>0時50分</s></div>'
 +'<div class="li"><span>声を使った 時間</span><s>2時間10分</s></div>'
 +'<div class="li"><span>書いた 日</span><s>54日</s></div></div>'
 +'<div class="note" style="margin:-2px 0 11px">まんなかの値です。くらべる先は、あなた自身です。よその目安は 出しません。</div>'
