Q1_WHICH_TOOL:
  ANSWER: "★★自前（Python ＋ Pillow ＋ numpy）。★pixelmatch も odiff も 要りません"
  REASON_1_MEASURED: |
    ★★床の ノイズが ★0 画素 でした。
    ★実測（★このコンテナ・Chromium・dsf 3・900×700）:
      ★作った ばかりの 小さな HTML を 2回 撮る        → 差 0 px
      ★★実物の 見本（作品を探す・2.8MB）を 3回 撮る  → 差 0 px
      ★別の プロセスで 立ち上げ直しても            → 差 0 px
    ★★ノイズが 0 なら ★『賢い くらべ方』は 要りません。★完全一致で 足ります。
  REASON_2_SMART_IS_WORSE: |
    ★pixelmatch の 既定の 閾値は 0.1、★アンチエイリアスを 見逃す 仕組みも 付いて います。
    ★★ノイズ 0 の ところに その 賢さを 持ち込むと ★見逃しに しか なりません。
    ★実測 ── ★RGB を 1 だけ 変えた 画素を 見つけられるか:
      閾値 0.0   → ★見つかる
      閾値 0.005 → ★★見逃す
      閾値 0.02  → ★★見逃す
      閾値 0.1   → ★★見逃す（★pixelmatch の 既定）
    ★★『#840C24 が #850C24 に なった』── ★これは 閾値 0.1 では 通ります。
      ★ブランドの 色が ずれても 気づけません。
  REASON_3_READABLE: |
    ★★較正するには ★道具の 中身を 全部 読める 必要が あります。
    ★pixel_lint.py は 120行ほど。★坂本さんも Code も 全部 読めます。
  REASON_4_PRACTICAL: "★このコンテナでは npm が 403（pixelmatch も odiff も 入りません）"
  NOT_CHOSEN:
    pixelmatch: "★閾値と アンチエイリアスの 賢さが ★ここでは 害に なる"
    odiff: "★速いが ★バイナリ依存。★2,000画素の 画を 秒で くらべる 必要は ありません"
  SPEED: "★実測 ── 2700×2100（dsf3）1組で 0.3秒ほど。★十分です"

