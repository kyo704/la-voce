      ★② まん中の 1画素を ★1 だけ 変えた 絵 → ★見つけられるか（★見逃さない ことの 確認）
    ★★②が 通らない かぎり ★本番の くらべっこを しません（★RESULT: NG で 止める）
  IMPLEMENTED: "pixel_lint.py が ★毎回 自動で やります。★外せません"
  MEASURED_IT_WORKS: |
    ★閾値 0.0   の 道具 → 較正 OK　★使ってよい
    ★閾値 0.005 の 道具 → ★★較正 NG　使わせない
    ★閾値 0.1   の 道具 → ★★較正 NG　使わせない
    ★★鈍い 道具は ★本番に 進めません。

  MY_MISTAKE_TODAY:   # ★★これが いちばん 大事な 話です
    WHAT: "★★較正器 そのものに 欠陥が ありました"
    DETAIL: |
      ★はじめ 1画素を (v + 1) % 256 で 変えて いました。
      ★★まん中の 画素が 白（255）だったので ★0 に 巻き戻り、
      ★★差 1 の つもりが ★差 255 の『いちばん 大きい ずれ』に なって いました。
      ★だから ★閾値 0.1 の 鈍い 道具でも 較正を 通って しまい、
      ★★番人に なって いませんでした。
    HOW_I_CAUGHT_IT: |
      ★『閾値 0.1 なのに 1画素を 見つけた』── ★辻褄が 合わない。
      ★★数字が 都合よすぎる ときに ★道具を 疑いました。
    FIX: "★v が 0 より 大きければ v-1、0 なら 1（★巻き戻さない）＋ ★assert で 差1 を 確かめる"
    LESSON: |
      ★★較正器も 道具です。★★較正器を 較正する 必要が あります。
      ★★その ために ★『鈍い 道具を 渡したら NG が 出るか』を 見ます。
      ★これが 出なければ ★較正器が 壊れて います。
    ADD_TO_MEASURES: "★M21f ★★番人を 置いたら、★番人が 眠って いないか を 確かめる"

