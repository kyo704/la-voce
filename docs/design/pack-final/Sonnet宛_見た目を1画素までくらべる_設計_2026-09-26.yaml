    node tools/shoot.js "file://.../見本.html" base.png \
      --clock=2026-09-26T10:00:00+09:00 --w=900 --h=700 --dsf=3
    node tools/shoot.js "http://localhost:3000/..." impl.png \
      --clock=2026-09-26T10:00:00+09:00 --w=900 --h=700 --dsf=3
  くらべる: "python3 tools/pixel_lint.py base.png impl.png"
  道具だけ試す: "python3 tools/pixel_lint.py --calibrate base.png"
  MUST_MATCH: "★★w・h・dsf・clock・locale・tz・scheme が ★1つでも 違えば 成り立ちません"
  SHOOT_ALSO_FREEZES:
    - "★reducedMotion: reduce"
    - "★animation / transition を none に する CSS を 足す"
    - "★caret-color を 透明に する（★★文字入力の カーソルの 点滅で 差が 出ます）"

