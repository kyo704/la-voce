Q2_DYNAMIC:
  ANSWER: "★★順に ①時計を 止める ②固定の データで 撮る ③どうしても 残る ものだけ 隠す"
  RANKING_WHY: "★上に 行くほど ★見逃しが ありません。★隠すのは 最後の 手です"

  ONE_FREEZE_CLOCK:
    HOW: "context.clock.setFixedTime()（★Playwright 1.56 で 動きました）"
    MEASURED: |
      ★時計を 止めないで 2秒 あけて 2回 撮る → ★差 1,249 px（★秒の 桁が 動く）
      ★時計を 止めて 同じ 時刻で 2回        → ★差 0 px
      ★時計を 9/26 と 12/31 に して          → ★差 10,016 px（★★止まって いる 証拠）
    COVERS: "★今日の 日付・時刻・『◯日前』・締切までの 残り・年度"
    CALIBRATION: |
      ★★『止まって いる』ことを 先に 確かめます。
      ★日付を 出す だけの 小さな HTML を 2つの 時刻で 撮り、★差が 出ることを 見ます。
      ★★差が 出なければ ★時計が 効いて いません（★出ていない だけかも しれない）。
      ★私は これを やって、★はじめ『効いて いる』と 思い込みかけました。

  TWO_FIXED_DATA:
    HOW: "★実装に ★テスト用の 固定データを 流す 口を 作る（★seed つき）"
    WHY_SAFER_THAN_MASK: "★★隠さないので ★その ところの ずれも 見つかります"
    WHAT_IT_NEEDS: |
      ★実装側の 仕事です:
        ★① 決まった 利用者・決まった 記録・決まった 件数 を 入れた 状態を 作れること
        ★② その 状態を ★何度でも 同じに 作れること（★seed を 固定）
        ★③ 本番の データには 触らないこと
    NOTE: "★★件数（『12件』）は ★時計を 止めても 変わります。★ここは 固定データでしか 止まりません"

  THREE_MASK_LAST:
    MEASURED_DANGER: |
      ★★隠した ところの ずれは ★まるごと 見逃します。
      ★実測 ── 帯の 800×140 を 真っ赤に 変えた 画:
        ★隠さずに くらべる → ★112,000 px の ずれ ★見つかる
        ★同じ ところを 隠す → ★★0 px ★★見逃す
    RULE:
      - "★隠す ところは ★毎回 一覧に 出す（★何画素 隠したか を 結果に 書く）"
      - "★隠した 割合が 全体の 2% を 超えたら ★★NG に する（★隠しすぎ）"
      - "★隠すのは ★『外から 来て 止められない もの』だけ（★外部APIの 応答・ランダムID）"
    IMPLEMENTED: "pixel_lint.py の compare(masks=…) が ★隠した 画素数を 返します"

  VERDICT: "★★『隠すか 固定データか』── ★固定データです。★隠すのは 残りかすだけ"

