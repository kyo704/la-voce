TOPIC: "T3 電気通信事業法の届出（他人の通信の媒介）"
TLDR: "①お問い合わせ転送＝自己と他人の通信（届出不要・第3号事業）。③連絡板・お知らせ＝一方向の『場』（届出不要）。②さがすの利用者間のやりとり（定型文でも）＝宛先を指定して加工せず届ける＝『媒介』＝★届出が要る。届出は無料・様式1本。設計で避けるより届出が安い"
KEY_FACTS:
  - FACT: "オンラインサービスは『情報の加工・編集を行わず、かつ、通信の宛先として受信者を指定する場合』に他人の通信の媒介に該当すると判断される。他人の通信には自己と他人との間の通信も含まれ、企業が自ら運用するサーバで利用者と通信する場合も『電気通信設備を他人の通信の用に供する』に当たる（＝電気通信事業ではあるが、媒介でなければ届出不要）"
    SOURCE_URL: "https://www.soumu.go.jp/main_content/000477428.pdf"
    SOURCE_REF: "総務省『電気通信事業参入マニュアル［追補版］』令和5年1月30日改定"
  - FACT: "登録・届出が不要な電気通信事業（第3号事業）＝電気通信回線設備を設置せずに、他人の通信を媒介する役務以外の役務を提供する事業（法164条1項3号）"
    SOURCE_URL: "https://www.soumu.go.jp/main_content/000739290.pdf"
    SOURCE_REF: "同マニュアル 13〜14頁・電気通信事業法164条1項3号"
  - FACT: "リアルタイムの電子掲示板のような『場』の提供は登録・届出不要。ただしサービスの一部として利用者間のメッセージの媒介機能を提供する場合は登録または届出が必要"
    SOURCE_URL: "https://www.soumu.go.jp/main_sosiki/joho_tsusin/policyreports/japanese/misc/Entry-Manual/TBmanual02/entry02_01.pdf"
    SOURCE_REF: "同マニュアル 事例（フローチャート(3)Ⅲ）"
  - FACT: "SNS は一般に媒介しないため第3号事業。ただし特定の利用者間のみでやりとりできるダイレクトメッセージ機能は媒介に当たり、登録または届出が必要"
    SOURCE_URL: "https://www.keidanren.or.jp/journal/times/2022/0407_10.html"
    SOURCE_REF: "総務省ガイドブック（令和4年）の説明・経団連タイムス 2022-04-07"
APPLIES_TO_WOOLSONG:
  CONTACT_FORWARD_128: "NO（利用者→Woolsong→本人のメール。Woolsong が『通信の主体』側で、宛先は本人固定・自己の通信）"
  NOTICE_BOARD_AND_SCHOOL_NOTICES: "NO（一方向・掲示。受信者を個別に指定して届ける機能ではない）"
  MATCHING_94_95: "YES（募集者と応募者の間で、定型文でもメッセージを宛先指定で届ける。成立後のやりとりはなおさら）"
IF_YES_WHAT_TO_DO:
  OPTION_A_FILE_NOTIFICATION（推奨）:
    - "電気通信事業法16条の届出（『電気通信事業届出書』）を、さがすの公開前（個人販売 2027-01 より前）に総務省（関東総合通信局）へ提出。個人事業者で可。手数料なし。届出後の主な義務：通信の秘密（4条）、利用者情報の適正な取扱い、業務の改善命令への対応。100万利用者未満なので年次報告の負担は小さい"
    - "通信の秘密：定型文・成立後のやりとりを運営が『通報時に坂本さんが見る』（裁定94 例外②）のは、利用者の同意（規約）に基づく閲覧として整理し、規約に明記する"
  OPTION_B_REDESIGN（届出を避けるなら）:
    - "宛先指定をなくす：応募を『募集への掲示』（募集者だけが見る掲示板の投稿）にし、成立後のやりとりを作らない（LINE へ）。ただし『募集者だけが見る』は実質的に宛先指定と評価されうる（SPLIT）。届出の方が確実"
DOC_CHANGES:
  TERMS: "『さがす』の条に、運営者が電気通信事業の届出を行っていること、通報時に運営者がやりとりを閲覧すること（同意）を明記"
  PRIVACY_POLICY: "利用目的に『さがすのメッセージの送受信と、通報時の確認』"
  TOKUSHOHO: "変更なし"
  DESIGN: "裁定94・95 に『届出電気通信事業者として運用』の一行。裁定128 の転送は変更なし"
RELIABILITY: "High（マニュアルは一次資料。DM の該当性は総務省の説明どおり）"
UNRESOLVED_QUESTIONS:
  - "届出が T8（外部送信規律）の適用の前提になる（届出事業者は規律の対象）。T8 で扱う"
  - "定型文のみのメッセージを『加工・編集』と見る余地（テンプレートの選択は加工ではない、が通説的理解。UNKNOWN）"
