DATA_MODEL:
  PAGE: {template: "t16", theme: {accent, accent2, font, latinHead, density, textSize, photoTone, paper}, hero: {name, title, oneLine, nextEvent: auto|manual}, sections: [Section], version, publishedAt, updatedAt}
  SECTION: {key: profile|events|rep|press|video|contact|custom, title, visible, order, blocks: [Block], sort: auto|manual|date|composer|year}
  BLOCK: {type: text|quote|photo|gallery|video|rule|space, content, photos: [PhotoRef], options: {width: full|half, align}}
  PHOTO: {id, w, h, tone, shape}
  AUTO_SOURCES: {events: "本人が登録した本番（source=self）のみ。org_events は引かない（その57）", rep: "作品の雛形から", nextEvent: "events の直近1件"}
  VERSIONING: "1つ前の版だけ保持（undo）。公開版と編集版は別"
  LIMITS: {photos: 12, customSections: 4, blocksPerSection: 6, text: 600, heading: 40, oneLine: 120}
  THEME_ADD: {colorMode: "accent|wide", headFont: "9種から", bodyFont: "4種から"}

