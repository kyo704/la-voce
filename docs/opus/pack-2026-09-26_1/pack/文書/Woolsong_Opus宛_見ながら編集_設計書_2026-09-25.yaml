EDITOR_UI:
  MODE: "『見る』と『編集する』の切替。編集中は本人にだけ見える。公開は『公開する』を押したときだけ"
  INLINE: "文字はその場で編集。写真は枠を押すと『上げる／替える／外す／形』の小さな窓"
  SIDE_PANEL:   # 既存のカスタマイズ側板を拡張
    - "型を替える（中身は引き継ぐ。14日は無料で選び直し＝裁定146）"
    - "色・書体・余白・文字の大きさ・写真の色味・紙の質感"
    - "節の表示／順番／追加"
    - "スマホ／PC の見た目の切替（実寸）"
    - "『1つ前に戻す』『最初の型の状態に戻す』"
  ADD_AFFORDANCE: "節と節のあいだに『＋ ここに足す』。押すと部品の一覧（7種）"
  DELETE: "編集中、節に触れると右上に『この節を消す』、足した部品には『これを消す』。消すと隣の『＋』も消える。左の一覧に『消しました（1つ前に戻すで復元）』と出る。『1つ前に戻す』で節も部品も一覧の状態も戻る"
  COLOR_MODES: "色の効き方を2段：『差し色だけ』（見出し・線・次の本番・引用・連絡）／『広く使う』（加えて上の帯・地の薄い色・最初の画面の区切り・フッターの線）。差し色だけでは変化が分からない型があるため"
  FONTS: "見出しの書体9種（Cormorant／しっぽり明朝／Zen Old明朝／解星デコール／Zen Antique／游字祝／Klee／Dela Gothic／Playfair）と、本文の書体4種（BIZ UDゴシック／Zen角ゴシック／しっぽり明朝／Noto明朝）を分ける。本文は可読性の研究に照らして4種で止める。すべてGoogle Fonts（OFL・商用可）"
  PROTOTYPE: "Woolsong_試作_ホームページ編集の画面_2026-09-25.html（余白の型で1画面。触れる）"
  SAVE: "自動保存（3秒）。保存の表示は出さない（催促・安心の演出をしない）。失敗したときだけ静かに知らせる"
  PREVIEW_LINK: "公開前に、期限つきの下見リンク（7日）を1本だけ発行できる（先生や事務所に見せる用）"
  NO: ["ドラッグでの自由配置", "文字色を任意に選ぶ", "外部フォントの読み込み", "HTML／CSSの直接編集", "自動再生の音・動画", "アクセス数の表示（順位づけに近づく）"]

