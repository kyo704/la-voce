TEMPLATE_REFACTOR:   # 54型をこの仕組みに載せる
  APPROACH: "各型のHTMLを『骨格（固定）』と『スロット（差し替え可）』に分ける。スロットは data-slot 属性で宣言し、描画はデータから"
  SLOT_TYPES: ["hero.name", "hero.title", "hero.oneLine", "hero.next", "hero.photo", "section.<key>", "block.*"]
  RULE: "型ごとに『置ける部品』と『置ける位置』を宣言する（例：名刺型は追加不可、余白型は写真3枚まで）"
  EFFORT_BY_GROUP:
    - {group: "機械的に変換できる（節が縦に積まれている型）", count: 36, effort: "3日"}
    - {group: "骨格が特殊で手で直す（幕・番付・ポスター・原稿用紙・巻物・名刺・発車標・搭乗券・天気図・星座早見・図鑑・書道）", count: 18, effort: "6日"}
  DROP_CANDIDATES: "変換の手間に見合わない型は、この時点で落とす（坂本さんが一括で決める画面を先に作る）"

# ---------------------------------------------------------------
CONTACT_INQUIRIES:   # お問い合わせの届け先（2026-09-25 の相談を反映）
  DECISION: "受信箱（アプリ内）を主にし、メールは『届いています』の知らせだけ。本文の転送はしない。返事はアプリの外（本人のメール）でする"
  WHY:
    - "費用は問題にならない（送信の相場：無料枠 月3,000通／月5万通で約$20／SESは1,000通$0.10。1万人×月2通でも月$2〜20）"
    - "本当のコストは運用：到達性（SPF/DKIM/DMARC）、跳ね返りと苦情の処理、本文がメール経由で第三者のサーバに残ること"
    - "『DMを作らない』：外→中の一方通行で、利用者どうしの会話の箱は作らない。受信箱に返信ボタンは置かない"
  INBOX:   # ページの設定 › 届いたもの
    LIST: "日付・差出人名・冒頭1行。新しいものが上。未読の数は出さない（数の強調をしない）"
    DETAIL: "本文・差出人のメール・『メールで返す』（mailto、宛先＝差出人）・『済んだ』・『迷惑（以後この差出人は受け付けない）』"
    RETENTION: "90日で消える。一行で明記。掃除は定期実行に相乗り"
    TODAY_STRIP: "『きょう』の帯に『届いたものが1件』とだけ（数の強調をしない）"
  NOTIFY_EMAIL:
    CONTENT: "『あなたのページにお問い合わせが届いています』のみ。差出人名・冒頭・本文は載せない"
    RATE: "1日1通まで（同じ日に何通来ても1通）"
    OPT_OUT: "設定で『知らせを受け取らない』を選べる"
    ROUTE: "購入の確認メールと同じ送信経路。増えるのは種類1つ"
  DELIVERY_ADDRESS:
    DEFAULT: "アカウントのメール（画面には伏せ字で表示）"
    CUSTOM: "別のメールに切り替え可。確認メールのクリックで有効になるまで使わない"
    MANAGEMENT: "事務所のメールも可（同じく確認つき）。本人が見られなくなる形を許すかは Opus の判断"
    OFF: "受け付けない"
    NEVER_SHOWN: "本人のメールはページに一切出ない。返信して初めて相手に見える（本人の判断）"
  SENDER_SIDE_GUARDS:
    - "名前1〜60字・本文2,000字・メールの形式（台帳の制約に既にある：page_inquiries）"
    - "同じIPから1時間3通まで・蜜壺（bot用の隠し欄）・URL3本以上は保留"
    - "受け手の週の上限（例30通）を超えたら本人に知らせ、止められる。通報の対象にも"
    - "18歳未満の印のあるページは受け付けない（そもそも公開できない）"
  LEDGER:
    - "portfolios に4列：contact_mode（account|custom|management|off）／contact_email／contact_email_verified_at／contact_note"
    - "page_inquiries に列：read_at／done_at／spam。blocked_emails は別表（owner_user_id, email_hash）"
    - "差出人のメールは個人情報：保存90日。プライバシーポリシーの『お問い合わせの受信』に、受信箱と知らせメールの形・保存期間を足す"
  DECISIONS_FOR_OPUS:
    - "受信箱に『返信』を置かない（メールで返すだけ）でよいか"
    - "既定＝アカウントのメールでよいか。『事務所のメール』を選択肢に入れるか"
    - "上限（1時間3通／週30通）と保存90日"

# ---------------------------------------------------------------
SEARCH_ENGINES:   # 2026-09-25 坂本さんの決定：ホームページは検索に出なければ意味が薄い
  DECISION: "『誰でも』で公開したページは、既定で検索に出す（noindex=false）。検索から外すのは本人が選んだときだけ。sql/11 の noindex 既定＝真は、この決定に合わせて改める（Opus の承認）"
  STILL_PROTECTED:
    - "『自分だけ』『同じ学校』の範囲は検索に出ない（そもそも外から見えない）"
    - "18歳未満の印があるページは公開できない（従来どおり）"
    - "非公開に戻せば、検索からも消える（noindex と sitemap から外す。反映まで数日かかる旨を一行）"
  BASICS:   # 検索に出るなら、最低限これを機械で用意する
    - "title：『名前 ― 肩書 ｜ Woolsong』。description：一行の自己紹介（120字）"
    - "OGP：写真（最初の画面の1枚）・title・description。SNSに貼ったときの見え方"
    - "構造化データ（JSON-LD）：Person（名前・肩書・写真・URL）と Event（出演予定：日付・会場・演目）。Google の『イベント』に載る条件"
    - "canonical：https://woolsong.app/p/<slug>。slug は本人が決める（英数字・変更は年2回まで）"
    - "sitemap.xml に公開ページを載せる。非公開・検索から外したものは外す"
    - "静的に書き出したHTML（速さ：LCP 2.5秒以内）。画像は縮小済み・alt は本人の名前"
    - "本番が終わると Event は自動で過去の扱い（出演歴）。検索に古い予定が残らない"
  LATER: "独自ドメイン（例：mio-shiraishi.jp をこのページに向ける）は 2027-04 以降。DNS の設定を本人に頼む必要があるので、案内の文書を先に用意する"
  DECISIONS_FOR_OPUS:
    - "noindex の既定を偽に改めることの承認（裁定の改訂）"
    - "Event の構造化データを出すか（検索の『イベント』に載る代わりに、会場と日時が機械に読まれる）"
    - "slug の変更回数（年2回）"

