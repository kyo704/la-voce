DOC: "ホームページの型 ― 見ながら編集（既存の型を、かなりの自由度で）設計書"
DATE: 2026-09-25（第3版・「必ず」と「あれば」の二段に分け、レパートリーの選択とアプリの情報からの自動埋めを追加）
AUTHOR: Fable
FOR: Opus（承認）・Claude Code（実装）・坂本さん
DECISION_BY_USER: "白紙（0から）はやらない。既存の型を、かなりの自由度でカスタマイズ・編集できるようにする（2026-09-25）"
RELATES_TO: ["ホームページ機能_設計書_2026-09-21（裁定128〜146）", "デザイン研究ノート_t52-t55（主役の規則）", "型 t01〜t74（削除分を除く54型）"]

# ---------------------------------------------------------------
PHASES:   # 何を1月に出し、何を4月以降にするか
  MUST_JAN:   # 必ず（2027-01 個人向け販売と同時）
    - "文字のその場書き換え（見出しの名前を含む）"
    - "写真：上げる・替える・外す・形（丸／角丸／四角）・色味（そのまま／白黒／セピア）。合計12枚"
    - "色8色＋効き方2段（差し色だけ／広く使う）、見出し書体9種、本文書体4種、余白3段、文字の大きさ2段"
    - "節の表示と順番。既定6節。最初の画面と『お問い合わせ』は固定"
    - "アプリの情報で埋める（片方向：アプリ→ページ）：名前・肩書・所属・次の本番・出演予定・レパートリー"
    - "レパートリーの選択（下の REPERTOIRE_PICKER）"
    - "本番が終わったら自動で出演予定から出演歴へ動く。手で消さない"
    - "スマホで編集できる（文字と写真は必ずスマホで完結）"
    - "公開の前の検査：機械で確かめ、合格なら『公開します ― はい／いいえ』の一問だけ。足りないものがあるときは、その項目だけ知らせる（住所／型／名前・肩書／本番の登録が1件以上／中身がある／18歳未満の印がない）。位置情報の除去は常にやるので項目にしない。効果をうたう言葉の検査は項目にしない（通報と本人の責任で扱う）"
    - "1つ前に戻す。自動保存（表示なし）"
    - "60秒で完成：型を選ぶ→3問（肩書・一行・写真1枚）→次の本番は自動→公開できる状態に"
  SHOULD_APR:   # あれば（使われ方を見て 2027-04 以降）
    - "自由な節（最大4）と、節の中の部品（文章・引用・写真1枚・写真の並び・動画・区切り・余白。1節6つまで）"
    - "節と部品の削除（消すと『＋』も消える。1つ前に戻すで復元）― 部品を出すなら同時"
    - "下見リンク（7日・1本）"
    - "文章を貼るだけで分ける（既存のプロフィール文→経歴・受賞・師事・所属。字数の上限に収める）"
    - "うまく見えないの警告（写真の顔が切れる・文章が長すぎて崩れる。トリミングの提案、字数の目安）"
    - "年に一度だけ『更新しませんか』（本人にだけ、静かな一行。1年触っていないページに）"
    - "限定の型（月1・100部・通し番号）"
  WONT:
    - "自由配置・任意の色・外部フォント・HTML／CSS・自動再生・アクセス数"
    - "AIに文章を書かせる（本人の言葉でないページは本人の顔にならない）"
    - "型の自動おすすめ（型は自分で選ぶ）"

REPERTOIRE_PICKER:   # アプリにある作品が多い人のための「見せるものを選ぶ」
  SOURCE: "アプリの作品（本人が登録した役・曲。作品の雛形からの引用を含む）。健康の記録は一切引かない"
  DEFAULT: "新しい順に上限まで自動で選ぶ。本人が触るまでは自動（『自動』の札）"
  LIMIT: {shown: 12, note: "ページに出すのは12件まで。台帳には何件あってもよい"}
  UI:
    - "『レパートリー』の節に『選ぶ（全24件のうち12件）』のボタン"
    - "一覧：検索（題名・作曲家・役）、作曲家ごとにまとめる、チェックで選ぶ、上限に達すると残りは選べない（静かに止まる。赤くしない）"
    - "選んだものは上下で並べ替え。並びは『手で決めた順／作曲家順／年順』から"
    - "『自動に戻す』で既定に戻る"
    - "選択はページごとに保存（型を替えても引き継ぐ）"
  LEDGER: "portfolio_rep_selection（portfolio_id, work_id, sort_order）。空なら自動"
  EDGE: "作品が0件の人には、節ごと出ない（空の節は表示しない）。1〜12件の人は選ぶボタンが出ない（全部出る）"

# ---------------------------------------------------------------
PRINCIPLE:
  ONE_LINE: "型は『骨格』を渡す。利用者は骨格の中の『肉』を全部替えられる。骨格そのものは替えない"
  KEEPS: ["点数・順位なし", "健康の記録は出ない", "既定は非公開", "18歳以上", "催促しない", "取り上げない（型を替えても中身は残る）"]
  HERO_RULE: "最初の画面で『誰か・何をする人か・次にどこで会えるか』が必ず分かる。これは編集で消せない（位置と見せ方は型が決める）"

# ---------------------------------------------------------------
FREEDOM:   # 何が替えられるか（多い順）
  L1_WORDS:
    - "すべての文字を、その場で書き換えられる（クリック→編集）。見出しの名前も（例：「批評」→「言ってもらえたこと」）"
    - "欄の上限：見出し40字／文章600字／一言120字。超えると赤くならず、静かに止まる"
    - "自動で入る欄（予定・レパートリー）は、手で上書きもできる。上書きすると『自動』の札が消える"
  L2_PHOTOS:
    - "写真の枠は、上げる・替える・外す・並べ替える。枠の形（丸・角丸・四角）は型ごとの既定を個別に変えられる"
    - "枠の『追加』：写真1枚／写真の並び（2〜6枚）を、節と節のあいだに足せる（上限：合計12枚）"
    - "上げた瞬間に縮小（長辺1600px、100KB目安）。元画像は保持しない"
  L3_SECTIONS:
    - "節の表示／非表示と順番（既存）"
    - "節の『追加』：既定6節に加え、自由な節を最大4つ（見出し＋文章＋写真／引用／動画のどれか）"
    - "節の中の並び（例：予定を『日付順／演目順』、レパートリーを『作曲家順／年順』）"
  L4_LOOK:
    - "色：8色（既存）。加えて『色を2つ選ぶ』型では、主と従の2色"
    - "書体：3組（既存）。加えて『欧文の見出し書体』を3つから（Cormorant／Archivo／Playfair）― 型が欧文見出しを持つときだけ"
    - "余白：ふつう／ゆったり／つめる（3段）。文字の大きさ：標準／大きめ（老眼）"
    - "写真の色味：そのまま／モノクロ／セピア（型の既定を個別に変えられる）"
    - "背景の紙の質感：あり／なし（型による）"
  L5_BLOCKS_INSIDE_A_SECTION:
    - "節の中に、部品を足せる：文章／引用／写真／写真の並び／動画（YouTube）／区切り線／余白。1節に最大6部品"
    - "部品は上から積むだけ。横並びは『写真の並び』だけが持つ"
  L6_STRUCTURE_FIXED:   # ここは替えない
    - "型の骨格：最初の画面の作り（緞帳・番付・ポスターの格子・封筒 など）、グリッド、ナビの形、フッター"
    - "書体の本文（BIZ UDPGothic か 明朝）と最小文字サイズ・コントラスト（自動）"
    - "スマホの折り返し方（型が持つ）"

