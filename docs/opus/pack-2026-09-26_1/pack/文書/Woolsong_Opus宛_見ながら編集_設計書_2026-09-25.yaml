PUBLIC_VIEWING:   # 2026-09-25 坂本さんの決定
  NO_LOGIN: "『誰でも』のページは、会員登録なしで誰でも見られる。見るだけの人に登録を求めない（ログインの壁・メールの要求・ポップアップを置かない）"
  BADGE:
    WHERE: "画面の右下に小さな印（羊と『このページは Woolsong で作られています ― 自分のページを持つ』）。固定表示で、スクロールしても必ず見える。文章と重ならない位置"
    NOT: "上に帯を出さない、途中で割り込まない、閉じられない広告にしない。印は小さく、押した人だけ先へ"
    FOOTER: "フッターにも同じ一文（印を目立たなくする設定は本人が選べない＝つたえるに含まれる条件）"
    LINK: "woolsong.app/?from=page&of=<slug>。案内ページ（公式サイト）に着き、そこに『始める（会員登録）』がある。ページを見た人がそのまま登録できる"
    COUNT: "どのページから来たかは数える（本人には見せない。順位づけにしない）。紹介の仕組み（裁定）と合わせる"
  OWNER_OPTION: "有料の『ぜんぶ』では印を外せるかは Opus の判断（外せると宣伝が消える。外せないと高級の型で気になる）"
  DECISIONS_FOR_OPUS:
    - "印を外す選択肢を有料で認めるか（推奨：認めない。フッターの一文だけにする案は可）"
    - "印の文言"

