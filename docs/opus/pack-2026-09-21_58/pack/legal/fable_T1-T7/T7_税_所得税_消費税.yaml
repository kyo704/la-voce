TOPIC: "T7 税（イタリア滞在中の所得税／日本の利用者への電子サービスの消費税）"
TLDR: "所得税：滞在9か月・住民票あり・家財と事業が日本→日本の居住者のまま。2027年はイタリア滞在約200日で伊の税務居住者にもなりうる（日伊条約の振り分け）。消費税：電気通信利用役務の内外判定は『役務の提供を受ける者の住所』なので、利用者が日本にいれば運営者が国外にいても国内取引。★インボイス登録をすると課税事業者になる（2割特例は2026-09-30期で終了、令和8年度改正で3割特例）"
KEY_FACTS:
  - FACT: "電気通信利用役務の提供の内外判定は、役務の提供を受ける者の住所等が国内にあるかで行う（消費税法4条3項3号）"
    SOURCE_URL: "https://www.nta.go.jp/publication/pamph/pdf/0024003-087_02.pdf"
    SOURCE_REF: "国税庁『国境を越えた役務の提供に係る消費税の課税関係について』令和6年7月"
  - FACT: "住所等が国内かどうかは、申告された住所とカードの発行国の照合など、合理的かつ客観的な方法で判定する"
    SOURCE_URL: "https://www.nta.go.jp/publication/pamph/pdf/0024003-087_02.pdf"
    SOURCE_REF: "同"
  - FACT: "インボイス登録に伴う2割特例は、2026年9月30日までの日の属する課税期間で終了。登録の経過措置により2029年9月30日までは課税事業者選択届出書なしで登録できるが、登録日から2年を経過する日の属する課税期間までは免税に戻れない"
    SOURCE_URL: "https://www.yayoi-kk.co.jp/shinkoku/oyakudachi/kojinjigyonushi-toroku/"
    SOURCE_REF: "弥生 解説（国税庁資料の引用）2026-09（補助）"
  - FACT: "令和8年度税制改正で、インボイス登録により免税事業者から課税事業者となった個人事業者に係る『3割特例』が設けられた"
    SOURCE_URL: "https://www.nta.go.jp/taxes/shiraberu/zeimokubetsu/shohi/keigenzeiritsu/invoice-review/pdf/0026004-099-01-2.pdf"
    SOURCE_REF: "国税庁『令和8年度 税制改正特集 3割特例』"
  - FACT: "所得税：日本の居住者＝国内に住所を有し、または現在まで引き続き1年以上居所を有する個人（所得税法2条1項3号）。1年未満の留学で生活の本拠が日本なら居住者のまま（9/7〜9/8 の調査）"
    SOURCE_URL: "https://www.nta.go.jp/taxes/shiraberu/taxanswer/shotoku/2012.htm"
    SOURCE_REF: "国税庁 タックスアンサー No.2012 居住者・非居住者の判定"
  - FACT: "イタリア：暦年183日超の滞在（入国日・出国日を各1日と数える）で税務居住者の要件を満たしうる。2027年は約200日（Sonnet 9/7 調査）。日伊租税条約の振り分け規定で決まる"
    SOURCE_URL: "https://www.mof.go.jp/tax_policy/summary/international/tax_convention/index.htm"
    SOURCE_REF: "日伊租税条約 4条（居住者）・Sonnet 調査 2026-09-07（補助）"
APPLIES_TO_WOOLSONG:
  INCOME_TAX_JP_RESIDENT: "YES（居住者のまま。2027年分は帰国後の申告）"
  ITALY_RESIDENCY_2027: "SPLIT（滞在日数で要件を満たしうる。課税水準に届くかは事業の規模次第。9/8 の閾値管理どおり）"
  CONSUMPTION_TAX_DOMESTIC: "YES（利用者が日本→国内取引。運営者の所在は関係ない）"
IF_YES_WHAT_TO_DO:
  - "消費税：インボイス登録をするなら、登録月から課税事業者。売上に係る消費税を申告（3割特例の要件と期間を国税庁資料で確認）。登録しない選択肢：大学が仕入税額控除を求めるなら登録が実質必要。学校の販売（2027-04）の直前に登録すれば、個人販売（2027-01〜03）の期間は免税のまま"
  - "内外判定の証拠：申込時の住所（都道府県まで）と、Stripe のカード発行国を照合し、日本以外なら販売しない（T2 の『日本にお住まいの方向け』と同じ設計）"
  - "所得税：住民票は転出しない。2027年の伊滞在日数を記録。有料ユーザー年間平均100人、または日本の口座の最高残高が約250万円に近づいたら日伊に通じた税理士（9/8 第3版の閾値）"
  - "青色申告承認申請を出発前に（9/7 の整理どおり）"
