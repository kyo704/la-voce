DOC: "公式サイト 第2版（woolsong.app）― 設計書と取り掛かり方"
DATE: 2026-09-26
AUTHOR: Fable
FOR: Opus（判断）・Claude Code（実装）・写し：坂本さん
ARTIFACTS:
  - "Woolsong_公式サイト_第2版_2026-09-26.zip（index.html＋img 14枚＋demo 12本。フォルダで開く）"
  - "Woolsong_公式サイト_第2版_単体_2026-09-26.html（1ファイル。埋め込み画面も中で動く）"
PRINCIPLE: "公式サイトは『実際の画面』で語る。作り物の画像・偽の計算機・想像のUIは置かない。だから、サイトが見せるものは、先に実装に無ければならない"

# ---------------------------------------------------------------
STRUCTURE:   # 演奏会のプログラムの形（幕→番付→I〜VI→幕間→終幕）
  HERO:
    - "緞帳（スクロールで上がる）。羊はアプリの羊のPNG（動く見本の SHEEP.plain）を使う。私の描いた羊は使わない"
    - "見出し『声を使う人のための記録と、ホームページと、教室・公演。』／副『舞台に携わる人たち、そして先生と学校と稽古場のために。』"
    - "ボタン2つ：新規登録（無料）／ログイン。上の帯の右端にも同じ2つ（すでに使っている人がいるので『事前登録』は置かない）"
    - "右に縦書きの約束：点数をつけません。急かしません。誰にも見せません。（1文字ずつ積む実装）"
  I_PROMISE: "4つ（点数を出さない／急かさない／本番の前は静かにする／誰にも見せない）＋根拠1行。『四つだけ先に言います』『今日は書かないボタン』の文は置かない"
  II_RECORD:
    - "★スマホの動く見本（00-動く見本-iPhoneで開く用.html）をそのまま埋め込む（触れる）。PC版ではない"
    - "上の説明文・切替の部品は隠す。ページ中央にスマホ1台"
  III_HOMEPAGE:   # ★統合した画面
    - "見出し『あなただけのホームページ』／『全ての人に見てもらえて、簡単に作成して公開できます。』"
    - "型12枚（実際の画面を撮った画像。押しても別の窓は開かない）"
    - "★型を押すと、下の1つの画面に『編集できる状態』で映る（型の選択と簡単編集は同じ画面。別々に置かない）"
    - "左300pxが側板、右がページ。側板は重ならない（2列のgrid。スマホは上下）"
    - "側板の上：見る／編集する・1つ前に戻す・公開する。その下：色8色・宣材写真・書体・写真の形・余白・節の表示と順番"
    - "特徴6つ：簡単編集／アプリの情報が自動で入る／検索に出る／お問い合わせ（受信箱。メールアドレスには届きません）／教室の紹介／やめたとき（公開は契約のあいだ。買った型と書いたものは残る）"
  IV_ISLAND: "『Woolsong アイランド』。島→地区→建物→住人の実際の画面を埋め込む（触れる）。『自分の家を建てる』は押しても遷移しない"
  V_SCHOOL: "レッスン割／出欠と行事（先生は0タップ。行事とくばりものを一斉送信。既読は一切数えない）／変わったらすぐ／稟議の一枚／導入について（申込→契約→名簿→合言葉→最初の1週間のおためし）／実技試験"
  VI_KOEN:
    - "香盤表から呼び出し／当日（子供を守る機能）／お金は動かさずに全部"
    - "★運営の動く見本の『チケットの値段』の画面をそのまま埋め込む。横幅いっぱいに縮尺し、内側でスクロールさせず全部を見せる（4案・自分で決める・この値段にすると・席種・くわしい決まり）"
  INTERMISSION_PRICE:
    - "月額だけ。年額は書かない（見づらい）"
    - "無料／つたえる 月300円／しらべる 月580円／よそおい 月580円／ぜんぶ 月980円／ホームページの型（プリセット）の追加 480円 買い切り／教室 月2,980円／学校 1席 250円〜400円（それ以上は書かない）／公演 0円〜15万円"
    - "学生：所属学校がシステムを導入している場合、他の有料機能が半額"
    - "やめたとき：書いたものと買った型は残る。ホームページの公開は契約のあいだ"
  FINALE: "新規登録（メール・パスワード8文字以上・18歳以上と規約同意）／ログイン／パスワードを忘れた。送るとメールの確認を一通"
  FOOTER: "利用規約・プライバシーポリシー・特商法・安全管理措置／© 2026 Kyo Sakamoto／日本にお住まいの方向け"

# ---------------------------------------------------------------
UNIFIED_EDITOR:   # III で動いている『型を選ぶ＋簡単編集』の仕様（見本の中に実装済み。実装の正にする）
  LAYOUT: "body を grid（300px + 1fr）。側板は sticky で重ならない。型の切替の帯は隠す"
  MODES: "見る／編集する。編集の枠は編集のときだけ出る"
  TEXT:
    - "文字のある要素（h1〜h4・p・li・td・th・blockquote・dd・dt・small・span・b・i・time・cite・a・div）で、子が装飾（b/i/span/small/em/br）だけのものは、その要素ごと contenteditable。★親が編集対象なら子は対象にしない（入れ子にしない）"
    - "見出し・名前など1行のものは Enter で確定（改行しない）"
    - "★縦組み（1文字ずつのspan）は、押すと小さな窓に横書きの一行で出る。決めると縦組みに組み直す（「」ー―、。の回転は自動）。1文字ずつは触らせない"
  PHOTO:
    - "写真（.headshot）を押すと窓：上げる／替える（端末の写真を選ぶ→縮小→位置情報を捨てる）／位置を直す（写真をつかんで動かす。端で止まる）／形（四角→角丸→丸）／外す"
  REPERTOIRE:
    - "★データ参照が基本。編集モードで節の上に『レパートリーを選ぶ（アプリの作品 N件 → 12件まで）』"
    - "一覧：作曲家ごと・検索・チェック・12件で静かに止まる・並び（選んだ順／作曲家順／年順）・自動に戻す"
    - "手入力もできる：題名＋役・曲を『足す』（作品の台帳には入れない。ページの中だけ）"
    - "節の作り直しは、その型の1件目を雛形にして中身だけ差し替える（型ごとの見た目を壊さない）"
  SECTIONS: "表示／非表示・順番（側板）。節の追加・削除・部品の追加は『あれば（4月）』"
  HISTORY: "1つ前に戻す（30段）。自動保存（表示なし）"
  PUBLISH: "検査に通れば『公開します ― はい／いいえ』の一問。足りないものがあるときだけ、その項目（住所／型／名前・肩書／本番1件以上／中身／18歳未満でない）"
  DATA_FLOW: "アプリ→ページの片方向：名前・肩書・所属・次の本番・出演予定・レパートリー。ページ側で直すのは表示だけ"

# ---------------------------------------------------------------
NOT_YET_IN_IMPLEMENTATION:   # ★ここが本題。サイトが見せるもので、実装に無いもの。先に作らないと嘘になる
  A_EDITOR_LAYER:
    WHAT: "型の上で動く編集の層（本文の contenteditable・縦組みの窓・写真の窓・レパートリーの選択・履歴・見る／編集・公開の一問）"
    STATUS: "見本の中では動く（JSの注入）。本番の Next.js には無い"
    LEDGER: "portfolios.theme（jsonb）／portfolio_rep_selection／portfolio_photos／editing と published の2版／page_inquiries の read_at・done_at・spam（見ながら編集 設計書 第3版のとおり）"
    EFFORT: "2週間強"
  B_TEMPLATE_SLOTS:
    WHAT: "54型をデータから描く形に変換（骨格＝固定、スロット＝差し替え）。いまは文字がHTMLに直書き"
    STATUS: "見本は直書きのHTMLを編集している。本番はデータから描かないと保存できない"
    EFFORT: "機械的な36型 3日／手で直す18型 6日。★その前に『型の一括採否の画面』で坂本さんが採る型を絞る"
  C_PUBLIC_PAGE:
    WHAT: "会員登録なしで見られる公開ページ（静的書き出し・noindex 既定＝偽・title/description/OGP/JSON-LD Person+Event/sitemap）＋右下の印（woolsong.app/?from=page&of=<slug>）"
    STATUS: "sql/11・21・78・80 に公開の条件と範囲はある。書き出しと SEO と印は無い"
    EFFORT: "1週間"
  D_INBOX:
    WHAT: "お問い合わせの受信箱（一覧・メールで返す・済んだ・迷惑・90日）と『届いています』の知らせ（本文なし・1日1通）と届け先の設定"
    STATUS: "page_inquiries はある。受信箱の画面・知らせ・設定は無い"
    EFFORT: "4日"
  E_ISLAND:
    WHAT: "Woolsong アイランド（島→地区→建物→住人、一覧・検索・並び）"
    STATUS: "試作のHTMLのみ。台帳（区分の列・地図に載せる同意）も画面も無い。絵は作家待ち"
    EFFORT: "台帳1日＋画面3日。★販売の後、住人が増えてから。サイトに置くのは『公開した人が住む』前提の説明で可"
  F_TICKET_PRICE:
    WHAT: "チケットの値段（sql/88 ticket_plans）"
    STATUS: "台帳と関数はある。★席種の列と有効席数の計算が無い（F-M2b）。動く見本の画面は席種を出しているので、関数を合わせる"
    EFFORT: "半日"
  G_SIGNUP_LOGIN:
    WHAT: "公式サイトからの新規登録・ログイン（18歳以上の確認・規約同意・確認メール）"
    STATUS: "アプリ側にある。公式サイトからの導線（?from=site）を足すだけ"
    EFFORT: "半日"
  H_PRICING_LEDGER:
    WHAT: "サイトの値段の表示＝price_check.py の確定案と一致すること。学生半額の条件『所属学校が導入している場合』は裁定に無い（★Opus）"
    EFFORT: "確認のみ"

# ---------------------------------------------------------------
HOW_TO_START:   # 取り掛かり方
  RULE: "サイトの各節は『実装が動いてから』差し替える。順番は、実装→動く見本→サイトの埋め込み。サイトが先に走らない"
  ORDER:
    - {step: 1, what: "型の一括採否の画面（54枚）→採る型を決める", who: "Fable→坂本さん", when: "出発前"}
    - {step: 2, what: "B 型のスロット化（採った型だけ）＋ A 編集の層の台帳", who: "Code", when: "2026-11"}
    - {step: 3, what: "A 編集の層の画面（見本の JS を仕様として移す：ws-edit の各関数）", who: "Code", when: "2026-12"}
    - {step: 4, what: "C 公開ページ＋印＋SEO、G 登録の導線、F 席種", who: "Code", when: "2026-12〜2027-01"}
    - {step: 5, what: "D 受信箱と知らせ", who: "Code", when: "2027-01"}
    - {step: 6, what: "サイトの III・VI を『本番の画面』で差し替え、単体HTMLをやめて woolsong.app に載せる", who: "Code", when: "2027-01 個人向け販売と同時"}
    - {step: 7, what: "E アイランド（住人が増えてから）", who: "Code", when: "2027-04〜"}
  SITE_UNTIL_THEN:
    - "III と VI の埋め込みは、実装ができるまで『動く見本』のままでよい（見本は実装と同じ中身、という前提を守る）"
    - "II（スマホ）と VI（運営）はすでに実装と同じ見本なので、そのまま"
    - "IV アイランドは『近日』の札を付けるか、住人が0人のあいだは節ごと外す（★Opus）"
  VERIFY:
    - "サイトの各埋め込みが、対応する画面と同じ版であること（版タグを合わせる）"
    - "編集の層：12型で、文字・写真・縦組み・レパートリーの4つが動くこと（fixture E10〜E13 として追加）"
    - "公開の一問と『あと少し』の分岐"
    - "スマホ幅390でサイト全体が横に動かないこと"

DECISIONS_FOR_OPUS:
  - "III の統合（型の選択と簡単編集を1画面に）を正とすること"
  - "学生半額の条件（所属学校が導入している場合）を裁定にするか。裁定155は『本人が買うとき半額』"
  - "IV アイランドを販売開始のサイトに置くか（近日／外す）"
  - "値段の表示は月額だけ、学校は『1席 250円〜400円』だけ、公演は『0円〜15万円』でよいか（年額・下限・導入支援は書かない）"
  - "型の採否の画面を出発前に作ることの承認（54→30前後に絞る）"
