TOPIC: "T4 景品表示法（ぜんぶ 月980円『単品合計1,460円』／年12,800円『10%引き＋244点』／学生半額／14日無料）"
TLDR: "単品を実際に同時に同価格で売っていれば『単品の合計』との比較は不当表示にならない。『10%引き』は同じ根拠。学生半額は通常価格が実在すれば可。14日無料は『その後どうなるか』を同じ画面に書けば可。★避けるのは、売っていない単品価格や、将来の値上げを根拠にした表示"
KEY_FACTS:
  - FACT: "二重価格表示自体は直ちに違法ではない。比較対照価格が実際の取引条件と乖離し、著しく有利と誤認させる場合に有利誤認（5条2号）となる"
    SOURCE_URL: "https://www.caa.go.jp/policies/policy/representation/fair_labeling/guideline/pdf/100121premiums_35.pdf"
    SOURCE_REF: "消費者庁『不当な価格表示についての景品表示法上の考え方』（価格表示ガイドライン）"
  - FACT: "過去の販売価格を比較対照価格とするときは『最近相当期間にわたって販売されていた価格』であること。目安はセール開始からさかのぼる8週間の過半で販売されていたこと。通算2週間未満、または最後の販売から2週間以上経過したものは当たらない"
    SOURCE_URL: "https://www.caa.go.jp/policies/policy/representation/fair_labeling/guideline/pdf/100121premiums_35.pdf"
    SOURCE_REF: "同ガイドライン 第4-1(2)"
  - FACT: "将来の販売価格を比較対照価格とする表示は、実際に販売することのない価格や、ごく短期間だけの価格であるときは不当表示のおそれ"
    SOURCE_URL: "https://www.caa.go.jp/policies/policy/representation/fair_labeling/guideline/pdf/100121premiums_35.pdf"
    SOURCE_REF: "同ガイドライン 第4-1(3)・執行方針（将来の販売価格）"
  - FACT: "他の顧客向けの販売価格や割引率の表示にも同じ考え方（実際の取引条件と乖離しないこと）"
    SOURCE_URL: "https://www.caa.go.jp/policies/policy/representation/fair_labeling/representation_regulation/double_price"
    SOURCE_REF: "消費者庁『二重価格表示』ページ"
APPLIES_TO_WOOLSONG: YES（表示の条件つきで適法）
IF_YES_WHAT_TO_DO:
  - "『単品の合計1,460円』：つたえる（年3,600→月300換算）・しらべる 月580・よそおい 月580 を、料金ページで同時に実際に販売する。換算値（年3,600÷12＝300）を使うなら『年3,600円を月に直した額』と注記。実際に月300円で売っていない以上、『月300円』単独の表示は避ける"
  - "『年12,800円（10%引き）』：比較の元＝単品の年額の合計 14,200円。3つとも実売していること。『10%引き』より『単品の年額の合計 14,200円』の併記の方が安全"
  - "『学生 半額』：通常価格（月980円／年6,400の元の12,800円）が実在するので可。条件（在籍・同意）を同じ画面に"
  - "『14日無料』：無料期間の終了後に自動で有料にならないこと、カード登録不要であることを同じ画面に。『無料』の語だけを大きくしない"
  - "販売開始時に『発売記念』等で単品を一時的に安くしない（比較対照価格の実績作りに見える）"
  - "証拠を残す：料金ページの日付つきスクリーンショットと Stripe の商品一覧（単品が同時に売られている証拠）"
DOC_CHANGES:
