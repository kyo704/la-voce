  PRICING_PAGE: "同上。『お得』『最大○%OFF』の語は使わない（有利誤認の入口）"
  TERMS: "変更なし"
RELIABILITY: "High"
UNRESOLVED_QUESTIONS:
  - "『つたえる 月300円相当』の表示は、月額商品が存在しないので『年額を12で割った参考値』と注記しても誤認と見る余地がある（SPLIT）。★安全側：『ぜんぶ』の比較は年額同士だけにし、月980円には比較対照を付けない"
