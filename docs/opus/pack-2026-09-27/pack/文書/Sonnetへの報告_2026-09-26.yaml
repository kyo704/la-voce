ROOT_CAUSE_CORRECTION:   # ★文書に書くときは こちらを 採ってください
  WRONG: "「その式全体が組み立てエラーとなり」── create のときの話に読めるが、create では落ちない"
  RIGHT: |
    plpgsql の本文の式は、create のときではなく★呼ばれたときに組み立てられる。
    だから 107 は当たってしまい、その晩から止まる。
    そして case は★1つの式なので、通る枝だけでなく★全部の枝をまとめて組み立てる。
    ★1本欠けると どの枝も通らない。
  PROOF: |
    本番で読み取りだけの確かめ:
      select case 'a' when 'a' then 1
                      when 'b' then public.no_such_function_xyz() end;
      → ERROR 42883（★通る枝は 'a' なのに 式ごと落ちる）
    台帳に残った番号と同じ 42883。
  WHY_THE_DISTINCTION_MATTERS: "原因が「順番」なら直しは「順番を守る」。原因が「束ねたこと」なら直しは「束ねをやめる」。順番は人が覚えるものなので、次に掃除を足すとき★また同じことが起きる"

