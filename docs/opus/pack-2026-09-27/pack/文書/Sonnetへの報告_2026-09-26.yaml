MEASURE_M21e:
  TITLE: "★1つの式に束ねると、1つ欠けて全部止まる"
  TEXT: "case・coalesce・array[…] のように1つの式にまとめると、通る枝だけでなく全部の枝がまとめて組み立てられる。1つ欠けるとどれも通らない。「足すだけだから安全」は成り立たない。足した1本が、あった4本を止める"
  ADD_TO_M21b: "「関数がある」と「呼ばれている」は別 ── に加えて★「呼ぶ側がある」と「呼ばれる側がある」も別"

