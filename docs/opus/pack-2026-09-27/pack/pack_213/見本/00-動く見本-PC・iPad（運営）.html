<!doctype html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Woolsong 動く見本 ── PC・iPad（運営）統合版</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{ --card2:#FDFAF3;--line3:#E8DFC8;--ink4:#706456;--band:#F6F1E4;--band2:#F3ECDD;--band3:#FBF3E2;--enji-d:#8E1230;--ok:#3C6A56;--warn:#825A14;--err:#AD3846;--pick:#F6E4E8;--enji:#840C24;--yama:#8C6115;--midori:#447862;--paper:#FBF6EA;--card:#fff;
 --line:#E4DAC4;--line2:#F0E9DA;--ink:#261913;--ink2:#5A4C40;--ink3:#6B5C4E;--bg:#EFE7D6;
 --red:#B23A48;--sh:0 1px 0 rgba(0,0,0,.03),0 8px 24px rgba(90,72,48,.10)}
body{background:var(--bg);font-family:"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;color:var(--ink);
 display:flex;flex-direction:column;align-items:center;padding:20px 14px 50px;gap:12px;line-height:1.75;
 letter-spacing:.02em;font-feature-settings:"palt";font-variant-numeric:tabular-nums}
h1{font-size:20px;letter-spacing:.04em}
.lead{font-size:13.5px;color:var(--ink2);max-width:900px;text-align:center;line-height:1.9}
/* ── 端末の 枠 ── */
.dev{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh);overflow:hidden;
 display:flex;flex-direction:column;transform-origin:top center}
:root{--z:1}
/* 文字を 大きく（老眼対策）── 見える 大きさは 変えず、中の ものを 大きく します。
   zoom で 拡大し、その ぶん 幅を 割ります。だから 画面は はみ出しません。 */
.dev{zoom:var(--z)}
/* 大きくした ときは、横に 並べず 上下に します（表を 広く 使うため） */
.dev.big .col2{flex-direction:column}
/* ★狭いとき（スマホ）── ★2列を 縦に。★文字を 大きくした ときと 同じ やり方（2026-09-25） */
.dev.sp .col2{flex-direction:column;gap:12px}
.dev.sp .col2>*{min-width:0!important;width:100%}
/* ★表は ★横に スクロールさせず、★字を 少し 詰めて 収めます */
.dev.sp .tblwrap{max-height:none;overflow-x:auto}
.dev.sp table{font-size:13px}
.dev.sp table th,.dev.sp table td{padding:7px 8px}
/* ★押せる 大きさは 44px を 下回りません（★狭いほど 大事） */
.dev.sp .li,.dev.sp .btn,.dev.sp .pill{min-height:44px;display:flex;align-items:center}
.dev.big .col2>div{flex:1 1 auto!important;min-width:0!important;width:100%}
.dev.big .grid table.wk{min-width:0}
.dev.big .pane{flex-direction:column}
.dev.big .pane .lft{width:auto;max-height:230px;border-right:0;border-bottom:1px solid var(--line)}
.dev.pc{width:calc(1400px / var(--z));height:calc(880px / var(--z))}
.dev.ipadL{width:calc(1180px / var(--z));height:calc(830px / var(--z))}
.dev.ipadP{width:calc(830px / var(--z));height:calc(1120px / var(--z))}
.dev.sp{width:calc(390px / var(--z));height:calc(844px / var(--z))}   /* ★スマホ（2026-09-25） */
/* ── 上のバー ── */
.top{flex:0 0 52px;background:var(--enji);color:#fff;display:flex;align-items:center;
 justify-content:space-between;padding:0 20px;font-size:15.5px;letter-spacing:.04em}
.top .l,.top .r{display:flex;align-items:center;gap:14px}
.top .back{border:1px solid rgba(255,255,255,.45);border-radius:8px;padding:5px 11px;font-size:13.5px;cursor:pointer}
.badge{background:rgba(255,255,255,.18);border-radius:7px;padding:4px 10px;font-size:13px}
.badge.w{background:var(--warn);color:#4A3510;font-weight:700}
.rl{width:30px;height:30px;border-radius:50%;border:1px solid rgba(255,255,255,.45);
 display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;line-height:1}
.rl:hover{background:rgba(255,255,255,.18)}
/* ── 健康の線 ── */
.wall{flex:0 0 30px;background:var(--band2);border-bottom:1px solid var(--line);
 display:flex;align-items:center;padding:0 20px;font-size:13px;color:var(--ink2);gap:8px}
.wall i{width:7px;height:7px;border-radius:50%;background:var(--midori);display:block;flex:none}
.main{flex:1;display:flex;overflow:hidden}
/* ── 左のナビ ── */
.side{flex:0 0 232px;background:var(--card2);border-right:1px solid var(--line);padding:10px 0;overflow-y:auto;transition:flex-basis .16s ease}
/* ★アイコンレール ── 折りたたんだ姿。ラベルは 読み上げに 残す */
.side.rail{flex:0 0 68px}
.side.rail .nv{justify-content:center;padding:9px 0;gap:0}
.side.rail .nv span.lb{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.side.rail .gh,.side.rail .who,.side.rail .pin{display:none}
.side .gh{font-size:12.5px;letter-spacing:.14em;color:var(--ink3);padding:13px 14px 5px}
.side .nv{display:flex;align-items:center;gap:9px;position:relative}
.side .nv i{width:22px;height:22px;flex:none;display:flex;align-items:center;justify-content:center;opacity:.78}
.side .nv.on i{opacity:1}
/* ★レールのときは 大きく ── 字が 無いぶん、しるしを 強く */
.side.rail .nv i{width:26px;height:26px}
.side.rail .nv i svg{width:26px;height:26px}
/* ★レールのとき ── ★四角い 塗りに しない。
   ★幅68px では、白い 帯が ★ただの 正方形に 見えます      */
.side.rail .nv{padding:10px 0;margin:2px 0;border-radius:0;background:transparent}
.side.rail .nv:hover{background:transparent}
.side.rail .nv:hover i{opacity:1}
/* ★いま 開いている ところ ── ★しるしの 色と、★左の 細い 線だけ */
.side.rail .nv.on{background:transparent;box-shadow:inset 3px 0 0 var(--enji)}
.side.rail .nv.on i{color:var(--enji);opacity:1}
.sidetop .fold svg,.sidetop .sk2 svg{flex:none}
.sidetop{display:flex;align-items:center;gap:6px;padding:2px 10px 8px}
.sidetop .fold{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--card);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:13.5px}
.sidetop .sk2{flex:1;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--card);display:flex;align-items:center;gap:6px;padding:0 9px;font-size:13px;color:var(--ink3);cursor:pointer}
.side.rail .sidetop{flex-direction:column;padding:2px 0 8px}
.side.rail .sidetop .sk2{display:none}
/* ★コマンドパレット */
/* ══ ★表 ── 2026-09-18 の 調べに もとづく ══
   ・見出しの 行を 貼り付ける（NN/g：画面より 大きい 表では 行・列を 固定）
   ・いちばん 左の 列（名前）を 貼り付ける ── ★これが「錨」。
     横に すべると、どの 行を 見ているか 分からなくなります
   ・詰めぐあいを 変えられる（IBM Carbon：32 / 40 / 48px）        */
.tw{overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--card);
 max-height:min(62vh,560px);position:relative}
.tw table{border-collapse:separate;border-spacing:0;width:100%;font-size:13.5px}
.tw th,.tw td{padding:0 12px;border-bottom:1px solid var(--line2);white-space:nowrap;
 height:calc(40px * var(--z,1));text-align:left}
.tw thead th{position:sticky;top:0;z-index:3;background:var(--paper);
 font-weight:400;color:var(--ink3);font-size:13px;letter-spacing:.08em;
 box-shadow:inset 0 -1px 0 var(--line)}
/* ★錨の 列 */
.tw .anc{position:sticky;left:0;z-index:2;background:var(--card);
 box-shadow:1px 0 0 var(--line2)}
.tw thead .anc{z-index:4;background:var(--paper)}
.tw tbody tr:hover td{background:var(--paper)}
.tw tbody tr:hover .anc{background:var(--paper)}
.tw .num{text-align:right;font-variant-numeric:tabular-nums}
.den{display:flex;gap:5px;align-items:center;margin-bottom:9px;flex-wrap:wrap}
.den .lb{font-size:13px;color:var(--ink3);letter-spacing:.1em;margin-right:3px}
/* ★権限の 表 ── 行の 見出しも 錨に */
.mx td.c,.mx th.c{text-align:center;padding:0 6px}
.mx .dot{display:inline-block;width:17px;height:17px;border-radius:50%;
 border:1.6px solid var(--line);cursor:pointer}
.mx .dot.on{background:var(--enji);border-color:var(--enji);box-shadow:inset 0 0 0 3px var(--card)}
.mx .dot.lock{background:var(--line2);border-color:var(--line2);cursor:not-allowed;opacity:.55}
.mx tbody tr.gh td{background:var(--paper);font-size:12.5px;letter-spacing:.1em;
 color:var(--ink3);height:30px}
.pal{position:absolute;inset:0;background:rgba(38,25,19,.32);display:flex;align-items:flex-start;justify-content:center;padding-top:64px;z-index:40}
.palbox{width:min(560px,86%);background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 18px 44px rgba(60,44,28,.26);overflow:hidden}
.palbox input{width:100%;border:0;border-bottom:1px solid var(--line2);padding:15px 16px;font:inherit;font-size:15.5px;background:transparent;color:var(--ink);outline:none}
.palbox .pr{display:flex;align-items:center;gap:10px;padding:10px 16px;font-size:14.5px;cursor:pointer}
.palbox .pr:hover{background:var(--paper)}
.palbox .pr s{margin-left:auto;color:var(--ink3);font-size:13px;text-decoration:none}
.palbox .pg{font-size:12.5px;letter-spacing:.12em;color:var(--ink3);padding:9px 16px 3px}

.side .nv{padding:11px 20px;font-size:15.5px;color:var(--ink2);display:flex;align-items:center;gap:10px;cursor:pointer}
.side .nv:hover{background:#FBF6EA}
.side .nv.on{background:#fff;color:var(--enji);font-weight:700;box-shadow:inset 3px 0 0 var(--enji)}
.side .gp{font-size:12.5px;color:var(--ink3);letter-spacing:.14em;padding:16px 20px 6px}
.side .who{padding:12px 20px 14px;border-top:1px solid var(--line);margin-top:10px;font-size:13px;color:var(--ink2);line-height:1.8}
.body{flex:1;padding:18px 24px 24px;overflow-y:auto;background:var(--paper)}
h2{font-size:22px;margin-bottom:2px;letter-spacing:.03em}
.sub{font-size:13.5px;color:var(--ink2);margin-bottom:15px}
.h3{font-size:13px;color:var(--ink3);letter-spacing:.14em;margin:18px 0 8px}
.h3:first-child{margin-top:0}
/* ── 部品 ── */
.cards{display:flex;gap:12px;margin-bottom:16px}
.kpi{flex:1;background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px 15px;cursor:pointer}
.kpi:hover{border-color:var(--ink4)}
.kpi .t{font-size:13px;color:var(--ink2);margin-bottom:2px}
.kpi .v{font-size:30px;font-weight:700;letter-spacing:-.01em}
.kpi .v s{font-size:14.5px;font-weight:400;color:var(--ink2);text-decoration:none;margin-left:3px}
.kpi.al{border-color:var(--line);background:var(--card2)}.kpi.al .v{color:var(--red)}
.col2{display:flex;gap:16px;align-items:flex-start}
.col2>*{flex:1;min-width:0}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px}
.card.p0{padding:0 16px}
.li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;
 border-bottom:1px solid var(--line2);font-size:14.5px;cursor:pointer;min-height:44px}
.li:last-child{border:none}
.li s{color:var(--ink3);font-size:13px;text-decoration:none;text-align:right;flex:none}
.li:hover{color:var(--enji)}
.li.plain{cursor:default}.li.plain:hover{color:inherit}
.usu{font-size:13px;color:var(--ink3)}
.spt0{font-size:13.5px;font-weight:700;margin-bottom:3px}
.sh3{font-size:13px;color:var(--ink3);letter-spacing:.12em;margin:14px 0 5px}
.spt{width:100%;border-collapse:collapse;font-size:13px;line-height:1.7;font-variant-numeric:tabular-nums}
.spt th{background:var(--band2);color:var(--ink3);font-weight:400;text-align:left;padding:5px 7px;border:1px solid var(--line)}
.spt td{padding:5px 7px;border:1px solid var(--line);background:#fff;vertical-align:top}
.spt td.k{width:34%;font-weight:600;background:var(--card2)}
.fbtn{display:inline-block;margin-top:14px;font-size:13px;color:var(--ink3);
 border:1px solid var(--line);border-radius:99px;padding:5px 12px;cursor:pointer;background:#fff}
.fbtn:hover{border-color:var(--ink4);color:var(--ink2)}
.fbtn.on{color:var(--enji);border-color:var(--ink4)}
.note{font-size:13px;color:var(--ink2);line-height:1.9;margin-top:12px;
 background:var(--card2);border:1px dashed var(--line);border-radius:10px;padding:11px 13px}
.warn{background:var(--band);border:1px solid var(--line3);border-radius:10px;padding:10px 13px;
 font-size:13px;color:var(--ink2);line-height:1.8;margin-bottom:12px}
.btn{display:inline-block;border:0;background:var(--enji);color:#fff;border-radius:10px;padding:11px 20px;
 font:inherit;font-size:14.5px;font-weight:700;text-align:center;cursor:pointer}
.btn.g{background:#fff;color:var(--ink);border:1px solid var(--line);font-weight:400}
.btn.sm{padding:8px 14px;font-size:13.5px}
.btn.w{display:block;width:100%}
.btn.mid{background:var(--midori)}
.pill{display:inline-block;border:1px solid var(--line);border-radius:99px;padding:6px 13px;font-size:13.5px;
 color:var(--ink2);background:#fff;cursor:pointer;white-space:nowrap}
.pill.on{background:var(--enji);color:#fff;border-color:var(--enji);font-weight:700}
.pill.sm{padding:5px 9px;font-size:12.5px;min-height:44px;display:inline-flex;align-items:center}
.pills{display:flex;gap:7px;margin-bottom:12px;flex-wrap:wrap;max-width:100%;min-width:0}
.pill{max-width:100%}
.tag{display:inline-block;background:var(--band2);color:var(--ink2);border-radius:6px;padding:2px 8px;
 font-size:13px;margin-left:7px;white-space:nowrap}
.inp{width:100%;border:1px solid var(--line);border-radius:10px;background:#fff;padding:11px 12px;
 font:inherit;font-size:14.5px;color:var(--ink)}
.ta{width:100%;border:1px solid var(--line);border-radius:10px;background:#fff;padding:12px;
 font:inherit;font-size:14.5px;min-height:90px;resize:vertical;color:var(--ink);line-height:1.8}
.fl{font-size:13px;color:var(--ink3);letter-spacing:.1em;margin:14px 0 6px}
/* ══ 間（ま）の 段階 ── 3つだけ ══
   sp1 同じ まとまりの 中 ／ sp2 まとまりどうし ／ sp3 話が 変わる
   ★運営は 密度が 機能です。個人側のような 画面ごとの 疎密は 付けません。
   ★付けるのは 間の 段階だけ。詰まったまま、切れ目が 分かるように します。 */
:root{--sp1:6px;--sp2:16px;--sp3:30px}
.h3{margin:var(--sp3) 0 var(--sp1)}
.sh3{margin:var(--sp3) 0 var(--sp1)}
.fl{margin:var(--sp2) 0 var(--sp1)}
.card{margin-bottom:var(--sp2)}
.note{margin-top:var(--sp2)}
/* ── 動きを 減らす（端末の 設定に 従います） ── */
@media (prefers-reduced-motion: reduce){
 *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;
  transition-duration:.01ms!important;scroll-behavior:auto!important}
}
/* ── 表の 数字は 桁を そろえる ── */
table td.num,table th.num,.kpi .v{font-variant-numeric:tabular-nums}

.sw{width:44px;height:26px;border-radius:99px;background:var(--line);position:relative;flex:none;cursor:pointer;transition:.16s}
.sw i{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.16s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.sw.on{background:var(--enji)}.sw.on i{left:21px}
.empty{text-align:center;padding:32px 16px;background:#fff;border:1px dashed var(--line);border-radius:12px}
.empty .t{font-size:14.5px;line-height:1.8}.empty .s{font-size:13px;color:var(--ink2);margin-top:8px;line-height:1.8}
/* ── 表 ── */
.tblwrap{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:auto;max-height:560px;position:relative}
/* ★見出しの 行を 貼り付ける ── 全部の 表に 効きます
   （NN/g：画面より 大きい 表では 行・列を 固定せよ）        */
.tblwrap thead th,.tblwrap tr:first-child th{position:sticky;top:0;z-index:3;
 background:var(--paper);box-shadow:inset 0 -1px 0 var(--line)}
/* ★左の 列（錨）── 横に すべっても 残る */
.tblwrap .stick,.tblwrap .anc{position:sticky;left:0;z-index:2;background:#fff;
 box-shadow:1px 0 0 var(--line2)}
.tblwrap thead .stick,.tblwrap thead .anc,
.tblwrap tr:first-child .stick{z-index:4;background:var(--paper)}
/* ★詰めぐあい ── IBM Carbon の 32 / 40 / 48px */
/* ★行の 高さ ── ★文字の 大きさに 連動します。
   ★つまみを 2つに しません（文字4段 ＋ 行の 高さ ＝ 2軸に なる）。
   ★50〜60代の 方には、1つの つまみで 両方 動くほうが 分かります */
.tblwrap td,.tblwrap th{height:calc(40px * var(--z,1))}
html[data-th="dark"] .tblwrap .stick,html[data-th="dark"] .tblwrap .anc{background:#241D17}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:13.5px}
th{position:sticky;top:0;z-index:3;background:var(--band2);color:var(--ink2);font-weight:400;
 padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;font-size:13px}
td{padding:9px 10px;border-bottom:1px solid var(--line2);white-space:nowrap;vertical-align:middle}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}tr.click:hover td{background:var(--card2)}
td.num,th.num{text-align:right}
.stick{position:sticky;left:0;background:#FBF6EA;z-index:2}
th.stick{z-index:4}
/* ── 日程の 表 ── */
.grid{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:auto;max-height:600px}
.grid table{font-size:13px}
/* 週の 表は、曜日の 幅を そろえます */
.grid table.wk{table-layout:fixed;width:100%;min-width:560px}
.grid table.wk th:first-child,.grid table.wk td:first-child{width:104px}
.grid td{padding:3px;border-right:1px solid var(--line2);height:56px;white-space:normal;vertical-align:top}
.grid th{text-align:center}
.koma{border-left:3px solid var(--enji);background:var(--card2);border-radius:5px;padding:4px 6px;
 font-size:12.5px;line-height:1.45;height:100%;cursor:pointer;position:relative}
.koma:hover{background:var(--pick)}
.koma b{font-weight:700;display:block}
.koma.dup{border-left-color:var(--yama);background:var(--band3)}
.koma.mine{border-left-color:var(--midori);background:var(--band)}
.koma.busy{border-left-color:var(--ink4);background:var(--band);color:var(--ink4);cursor:default}
.koma.now{border-left-color:var(--red);background:var(--pick);color:var(--red);cursor:default}
.koma.busy.priv{border-left-style:dotted;border-left-width:4px;background:var(--band)}
.koma.sel2{outline:2px solid var(--ink);outline-offset:-2px}
.koma .pv{display:inline-block;font-size:12px;border:1px solid var(--ink4);border-radius:4px;padding:0 3px;color:var(--ink4)}
.slot{position:relative}
.slot .yt{position:absolute;right:2px;bottom:2px;font-size:12px;color:var(--ink3);border:1px solid var(--line);
 border-radius:4px;padding:0 3px;background:#fff;opacity:0;transition:.12s;white-space:nowrap}
.slot:hover .yt{opacity:1}
.slot .yt:hover{background:var(--yama);color:#fff;border-color:var(--yama)}
/* ══ 日程のカレンダー（ほかの カレンダーアプリと 同じ 組み方） ══ */
.cal{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.calh{display:flex;border-bottom:1px solid var(--line);background:var(--card2)}
.calh .gut{flex:0 0 58px;border-right:1px solid var(--line2)}
.calh .dh{flex:1;min-width:0;text-align:center;padding:8px 2px 7px;border-right:1px solid var(--line2)}
.calh .dh:last-child{border-right:0}
.calh .dw{font-size:12.5px;color:var(--ink3);letter-spacing:.08em}
.calh .dd{font-size:19px;font-weight:600;line-height:1.25;margin-top:1px}
.calh .dh.tdy .dw{color:var(--enji)}

   return '<div class="hr" style="top:'+(x*PXH)+'px">'+(HR0+x)+':00</div>'}).join('')+'</div>'
 +DAYS.map(function(d,di){
   var c='<div class="col'+(isToday(di)?' tdy':'')+'" style="height:'+H+'px">';

function autoAll(){

   if(A.offDay[di]||A.offKoma[ki])return;

 slots.sort(function(x,y){return A.dir==='早い順'?(x.k-y.k)||(x.d-y.d):(y.k-x.k)||(x.d-y.d)});

 var order=MONKA.map(function(m,i){return i});
 if(A.order==='空きが 少ない方から')order.sort(function(a,b){
   var f=function(i){var n=0;slots.forEach(function(s){if(isFree(i,s.key))n++});return n};
   return f(a)-f(b)});
 else order.sort(function(a,b){var d=gakuIdx(MONKA[a][1])-gakuIdx(MONKA[b][1]);
   return A.order==='上級生から'?-d:d});
 /* ③ 置く */

 var runOK=function(di,ki){
   /* 続けて 入れる 上限と、そのあとの 休みを 見ます */
   var run=1,i;
   for(i=ki-1;i>=0;i--){if(PLACED[di+'-'+i])run++;else break}
   var back=i;
   for(i=ki+1;i<myKoma().length;i++){if(PLACED[di+'-'+i])run++;else break}
   if(run>A.runMax)return false;
   if(A.restAfter>0){
     /* 直前に 上限まで 続いていたら、休みを 空ける */
     var prev=0;for(i=ki-1;i>=0;i--){if(PLACED[di+'-'+i])prev++;else break}
     if(prev>=A.runMax)return false;
     var gap=0;for(i=ki-1;i>=0&&gap<A.restAfter;i--){if(!PLACED[di+'-'+i])gap++;else break}
     var before=0;for(var j=ki-1-gap;j>=0;j--){if(PLACED[di+'-'+j])before++;else break}

         need:Math.ceil(Math.max(base,0)/Math.max(sus,1)),

var WKHEAD={'あ':'あいうえおアイウエオぁぃぅぇぉァィゥェォ',
 'か':'かきくけこがぎぐげごカキクケコガギグゲゴ',

 'ら':'らりるれろラリルレロ','わ':'わをんワヲンゐゑヰヱ'};
function wkHead(name,g){
 var c=String(name||'').charAt(0);
 if(g==='A')return /[A-Za-z0-9０-９Ａ-Ｚａ-ｚ]/.test(c);
 var t=WKHEAD[g]; if(!t)return true;
 if(t.indexOf(c)>=0)return true;
 /* ★漢字の ときは 読みが 分からないので ★『ぜんぶ』でだけ 出します */
 return false;
}
function wkEd(e){
 if(!e)return '';
 var t=String(e).replace(/^★+/,'').split(/[（(──]/)[0].trim();
 return t.length>22 ? t.slice(0,22)+'…' : t;
}
function wkBuild(W){

   var ch=w.R.some(function(r){return /合唱|コーラス/.test(r[0])})?1:0;
   WKALL.push({g:g, n:w.t, o:w.o||w.t, c:w.c||'', r:w.R.length, sc:w.S.length,
               min:w.d||0, ch:ch, u:0, tpl:'wk'+i, school:wkEd(w.e),
               nv:w.R.filter(function(r){return r[2]}).length,   /* ★声種の 入った 役の 数 */
               _a:(w.a||[]).join(' '),                          /* ★別名でも 探せるように */
               _k:w.k, _i:i, _a:(w.a||[]).join(' ')});
 });
 /* ★作曲家は ★多い順に 12人（★元も 多い順でした）*/
 Object.keys(cm).forEach(function(g){

 WKW=W;
}
