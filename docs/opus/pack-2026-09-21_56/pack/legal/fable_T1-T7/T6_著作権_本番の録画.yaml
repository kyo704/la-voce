TOPIC: "T6 著作権（公開ページに本番の録画を足す機能）"
TLDR: "★Woolsong が動画を自らホストすると、Woolsong が『送信可能化』の主体になり JASRAC 許諾（インタラクティブ配信）と実演家の許諾を自ら負う。YouTube の埋め込みだけにすれば、楽曲の許諾は YouTube（JASRAC 包括契約）側に載り、Woolsong は利用者に『共演者の同意・会場の許可・外国作品の手続き』を確かめさせるだけで済む。裁定128（動画は YouTube のURL）を変えない"
KEY_FACTS:
  - FACT: "YouTube は JASRAC と許諾契約を締結しているサービス。JASRAC 管理楽曲を含む動画を投稿できる"
    SOURCE_URL: "https://www.jasrac.or.jp/users/internet/ugc/"
    SOURCE_REF: "JASRAC『YouTube などの動画投稿（共有）サービスでの音楽利用』"
  - FACT: "自ら主催するコンサート等の模様をアップロードする場合、あらかじめ『演奏』に関する手続きが必要。学校の文化祭など非営利・入場無料・出演者無報酬をすべて満たす場合は演奏の手続きは不要（著作権法38条1項）"
    SOURCE_URL: "https://www.jasrac.or.jp/users/internet/ugc/"
    SOURCE_REF: "同ページ"
  - FACT: "外国作品を動画配信に利用する場合、あらかじめ『ビデオグラム録音』の手続きが必要（一部楽曲を除き、音楽出版社の指し値）。ライブ配信のみの場合は不要"
    SOURCE_URL: "https://www.jasrac.or.jp/users/internet/ugc/"
    SOURCE_REF: "同ページ・『配信用動画コンテンツを制作する際のビデオグラム録音手続き』"
  - FACT: "市販音源を使う場合は著作権とは別に著作隣接権（音源製作者・アーティスト）の許諾が必要。編曲・訳詞・替え歌は作詞者・作曲者の意向の確認が必要"
    SOURCE_URL: "https://www.jasrac.or.jp/users/internet/"
    SOURCE_REF: "JASRAC『インターネット上での音楽利用』"
  - FACT: "演奏会の配信・アップロードでは JASRAC の手続きの他に、実演家等の関係権利者の著作隣接権等の許諾が必要な可能性がある（収録業者・映像の権利元）"
    SOURCE_URL: "https://windbandpress.net/15225"
    SOURCE_REF: "Wind Band Press が JASRAC に確認した記事 2026-04-07（補助）"
  - FACT: "実演家は録音権・録画権（著作権法91条）と送信可能化権（92条の2）を持つ。共演者の実演を録画してネットに置くには各実演家の許諾が要る（映画の著作物に録音・録画された実演の例外あり）"
    SOURCE_URL: "https://elaws.e-gov.go.jp/document?lawid=345AC0000000048"
    SOURCE_REF: "著作権法91条・92条の2"
APPLIES_TO_WOOLSONG: YES
IF_YES_WHAT_TO_DO:
  DESIGN:
    - "動画は YouTube（および JASRAC と契約のあるサービス）のURLの埋め込みだけ。Woolsong のストレージに動画を置かない（裁定128 のまま。設計に『動画ファイルの受け入れは作らない』の一行）"
    - "埋め込みの前に、利用者に確認の4項目（下の CHECKLIST）。答えは保存しない（裁定145 の写真の『肖像の問い。答えは記録しない』と同じ形）"
    - "通報→削除の対応に『著作権・実演家の権利』の通報種別を足す。削除のみ・争わない"
  CHECKLIST_FOR_USER（埋め込む前の画面に）:
    - "共演者（伴奏者・合唱・オーケストラ）全員に、この録画をネットに載せることを伝え、了解を得ましたか"
    - "会場（ホール・学校）の撮影・公開の決まりを確かめましたか"
    - "外国の作品（著作権が切れていない作曲家・訳詞・編曲）を含む場合、YouTube 側の手続きは済んでいますか"
    - "有料公演・出演料のある公演の録画は、主催者の許可を得ましたか"
DOC_CHANGES:
  TERMS: "『公開ページ』の条に、(1)動画は外部サービスの埋め込みに限ること (2)利用者は楽曲・実演・肖像・会場の権利を自ら処理すること (3)権利者からの申立てで当方が表示を止められること、を足す"
  PRIVACY_POLICY: "変更なし（動画の中身は Woolsong が保持しない旨を明記してもよい）"
  TOKUSHOHO: "変更なし"
RELIABILITY: "High（JASRAC 一次資料・条文）"
UNRESOLVED_QUESTIONS:
  - "YouTube 動画を外部サイトに埋め込む行為について、JASRAC の『動画投稿サービスで配信されている動画を外部のサイトで利用する場合』のフローチャートの結論（個人・事業者の区別）を原文で確認する（UNKNOWN。埋め込みは送信可能化に当たらないとする裁判例の考え方はあるが、JASRAC の運用は別途確認）"
  - "オーケストラ・合唱団の録画は、団体側の内規（公開の可否）が先に立つ。会場の規約と同じ扱いで利用者に確かめさせる"
