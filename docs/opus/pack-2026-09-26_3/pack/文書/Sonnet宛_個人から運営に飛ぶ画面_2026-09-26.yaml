■ 坂本さんの ご指摘:
  原文: "見本に個人機能から運営画面に飛ぶページがないように思う"
  判定: "★そのとおり。しかも『ボタンはあるが 1度も動いていない』という 気づきにくい 形でした"

■ 見つけたこと（4つの見本・すべて 不通）:
  1:
    見本: "00-動く見本-PC・iPad（個人）.html"
    症状: "⚙もっと の 右の欄に「運営モードへ ›」は あった。★押しても 案内（toast）だけ"
    原因: |
      opsOpen() が location.href の '（個人）' を '（運営）' に 取り替える 作り。
      ★file:// で 開くと location.href の 日本語は 百分率符号化される。
        → …00-%E5%8B%95%E3%81%8F見本-PC%E3%83%BBiPad%EF%BC%88%E5%80%8B%E4%BA%BA%EF%BC%89.html
      ★そのため 取り替えが 1度も 当たらず、u===location.href に なり、
        『運営の見本は別ファイルです』の 案内だけが 出て 終わっていた。
    実測: "Chromium で 確認 ── same:true（1文字も 変わらない）"
  2:
    見本: "00-動く見本-PC・iPad（運営）.html"
    症状: "★左上の「‹ 戻る」も 案内だけ（『スマホ版の見本をご覧ください』）"
    判定: "個人に 戻る 道が 無かった"
  3:
    見本: "00-動く見本（さわれる・全画面）.html / 00-動く見本-iPhoneで開く用.html"
    症状: "★運営モードに 入れるのは 下の「デモの切替」だけ"
    判定: |
      あれは 見本を 見る人の ための もの。
      ★アプリの 中には 入口が 無かった。
      ★もっと に「学校の機能」「公演の機能」は あったが、
        『運営に 移る』という 意味づけは どこにも 無かった。

■ 直したこと:
  A_新しい画面:
    名: "運営に 切り替える"
    どの見本: "4つ すべて"
    中身:
      - "いま（個人・高木みなみ）→ 移る先（○○音楽大学 の運営・役職）を 並べて 見せる"
      - "通っている ところの 一覧。★役職の ある ところだけ 押せる"
      - "★役職の ない ところは 隠さない。見せて、押せなくする"
      - "約束の文（下記）を その場に 置く"
      - "戻りかたを 書く"
    入口: "⚙もっと の 一覧の いちばん上／もっと の 右の欄の ボタン（PC）"
  B_飛べるようにした:
    どこ: "PC・iPad（個人）"
    どう:
      - "swapURL(a,b) ── 日本語のまま／encodeURI／encodeURIComponent の 3つの形で 当てる"
      - "window.open を やめ <a href target=_blank> に した（file:// で 止められるため）"
      - "見つからないときは 素直に 言う（『名前を変えずに保存すると開けます』）"
  C_戻れるようにした:
    どこ: "PC・iPad（運営）"
    どう: "persLink() ── 同じ swapURL を 逆向きに。「‹ 個人に 戻る」"
  D_アプリの中で切り替わるように:
    どこ: "さわれる・全画面／iPhone"
    どう:
      - "SC['運営に切り替える'] を 足し、もっと の いちばん上から 入る"
      - "opsGo() ── 役職が ある ときだけ S.mode='o'"
      - "★役職なし・教室なし では 押せない（『役職が ないと 出ません』）"
      - "上の「‹ 戻る」を「‹ 個人に 戻る」に した（どこへ 戻るか 分かるように）"

■ 約束の文（★実装で 消さない・文書にも 同じ言い回しで）:
  - "運営の画面には 健康に関するものが 1つも ありません（画面そのものが ありません）"
  - "あなたの 声・からだの 記録は、運営に 移っても 見えません"
  - "ノート・レパートリー・たぶんノートも 見えません"
  - "運営に 移ったことは、誰にも 知らされません"
  - "運営で できるのは 名簿・日程・出欠・行事・連絡・ご請求・公演です"
  - "移っても、あなたが 通う 生徒としての 立場は 変わりません"
  - "役職が ない ところは 隠しません。見せて、押せなくします"

■ 検証（Chromium・実測）:
  - "① 個人 ⚙もっと に 行が 出る ── OK"
  - "② 押すと 画面が 開く（題『運営に 切り替える』）── OK"
  - "③ ○○音楽大学の「運営に 移る ›」が 本物の href ── OK"
  - "④ △△声楽教室は「移れません」で 押せない ── OK"
  - "⑤ 実際に 押して 運営に 着いた ── OK"
  - "⑥ 運営の「‹ 個人に 戻る」で 個人に 戻れた ── OK"
  - "⑦ 戻った先の 帯『この画面の記録は、先生にも学校にも運営にも届きません』── OK"
  - "⑧ 全画面／iPhone ── もっと → 切り替える → 移れる → 戻れる ── OK"
  - "⑨ 役職『なし』で opsGo() が 効かない（S.mode='p' のまま）── OK"
  - "⑩ 4つの 見本 すべて JavaScript の 誤り 0件"
  - "⑪ 総なめ（個人11画面・運営73画面）── ★直す前と 同じ。増減なし"

