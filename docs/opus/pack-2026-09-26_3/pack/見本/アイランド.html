<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Woolsong の土地 ― 声を使う人たちが住む島</title>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600;800&family=BIZ+UDPGothic:wght@400;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Kaisei+Decol:wght@500;700&family=Zen+Kurenaido&display=swap" rel="stylesheet">
<style>
  :root{--paper:#F7F2EA;--ink:#1B1614;--ink2:#5E554D;--ink3:#9A9087;--rule:#DDD4C6;--wine:#7A1F2E;--wool:#EFE9DE;--gold:#C9A961;
    --min:"Shippori Mincho",serif;--ud:"BIZ UDPGothic",system-ui,sans-serif;--lat:"Cormorant Garamond",serif}
  *{box-sizing:border-box} html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--ud);-webkit-font-smoothing:antialiased}
  header{display:grid;grid-template-columns:auto 1fr auto;gap:22px;align-items:center;padding:16px 28px;border-bottom:1px solid var(--rule);background:rgba(247,242,234,.95);position:sticky;top:0;z-index:10}
  header .brand{font-family:var(--min);font-weight:600;font-size:22px;letter-spacing:.06em;color:var(--wine)}
  header .brand small{display:block;font-family:var(--ud);font-size:11.5px;letter-spacing:.2em;color:var(--ink2);font-weight:400;margin-top:2px}
  header .search{display:flex;align-items:center;gap:8px;max-width:520px;justify-self:center;width:100%}
  header input{flex:1;border:1px solid var(--rule);border-radius:999px;padding:10px 16px;font-family:inherit;font-size:14px;background:#fff}
  header .me a{font-family:var(--min);font-size:13px;letter-spacing:.14em;color:var(--wine);text-decoration:none;border:1px solid var(--wine);border-radius:999px;padding:8px 16px;white-space:nowrap}
  .stage{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(360px,.75fr);min-height:calc(100vh - 70px)}
  .mapwrap{position:relative;padding:22px 28px 30px;background:radial-gradient(ellipse at 50% 30%,#FBF8F1,var(--paper) 70%)}
  .mapwrap .cap{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
  .mapwrap h2{font-family:var(--min);font-weight:500;font-size:16px;margin:0;color:var(--ink2)}
  .mapwrap .back{font-family:var(--ud);font-size:12.5px;color:var(--wine);background:#fff;border:1px solid var(--rule);border-radius:999px;padding:6px 12px;cursor:pointer;visibility:hidden}
  .mapwrap .back.on{visibility:visible}
  .frame{border:1px solid var(--rule);border-radius:16px;overflow:hidden;background:#BFD7E1;box-shadow:0 18px 40px rgba(27,22,20,.12)}
  svg.map{width:100%;height:auto;display:block}
  .dist{cursor:pointer}
  .dist .halo{opacity:0;transition:opacity .25s}
  .dist:hover .halo,.dist.on .halo{opacity:1}
  .dist .lbl{font-family:"Kaisei Decol",var(--min);font-size:22px;font-weight:700;fill:#2b2320;pointer-events:none}
  .dist .lbl.s{font-family:"Zen Kurenaido",var(--ud);font-size:14px;font-weight:400;fill:#5E554D}
  .ribbon{fill:#FFFDF7;stroke:#8f8470;stroke-width:1.4}
  .legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  .legend button{border:1px solid var(--rule);background:#fff;border-radius:999px;padding:7px 13px;font-family:var(--min);font-size:13px;cursor:pointer;color:var(--ink);display:flex;align-items:center;gap:8px}
  .legend button i{width:10px;height:10px;border-radius:50%;display:inline-block}
  .legend button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
  .side{border-left:1px solid var(--rule);background:#fff;padding:0 0 40px;overflow:auto;max-height:calc(100vh - 70px)}
  .side .head{padding:22px 24px 16px;border-bottom:1px solid var(--rule);background:linear-gradient(180deg,#FBF8F1,#fff)}
  .side .head .k{font-family:var(--lat);font-size:12px;letter-spacing:.34em;text-transform:uppercase;color:var(--ink3)}
  .side h3{font-family:var(--min);font-weight:600;font-size:26px;margin:4px 0 4px;letter-spacing:.04em}
  .side .sub{font-size:13.5px;color:var(--ink2);line-height:1.7}
  .side .count{font-family:var(--lat);font-size:13px;color:var(--ink3);margin-top:8px;letter-spacing:.1em}
  .index{padding:12px 24px 0}
  .index .all{display:flex;justify-content:space-between;align-items:center;font-family:var(--min);font-size:14px;padding:8px 0;border-bottom:1px solid var(--rule);cursor:pointer}
  .index .all span{font-family:var(--lat);color:var(--ink3);font-size:13px}
  .index details{border-bottom:1px solid var(--rule)}
  .index summary{list-style:none;display:flex;align-items:center;gap:10px;padding:9px 0;cursor:pointer;font-family:var(--min);font-size:15px}
  .index summary::-webkit-details-marker{display:none}
  .index summary i{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
  .index summary .c{margin-left:auto;font-family:var(--lat);font-size:13px;color:var(--ink3)}
  .index summary .arrow{color:var(--ink3);font-size:11px;transition:transform .2s}
  .index details[open] summary .arrow{transform:rotate(90deg)}
  .index summary.on{color:var(--wine)}
  .index ul{list-style:none;margin:0;padding:0 0 8px 20px}
  .index li{display:flex;justify-content:space-between;padding:6px 0;font-size:13.5px;cursor:pointer;color:var(--ink2)}
  .index li:hover,.index li.on{color:var(--wine)}
  .index li span{font-family:var(--lat);font-size:12.5px;color:var(--ink3)}
  .filters{display:flex;flex-wrap:wrap;gap:6px;padding:14px 24px 0}
  .filters button{border:1px solid var(--rule);background:var(--paper);border-radius:999px;padding:5px 12px;font-family:inherit;font-size:12px;cursor:pointer;color:var(--ink)}
  .filters button[aria-pressed="true"]{background:var(--wine);color:#fff;border-color:var(--wine)}
  .sort{display:flex;gap:14px;padding:10px 24px 0;font-size:12px;color:var(--ink3)}
  .sort button{border:0;background:transparent;font-family:inherit;font-size:12px;color:var(--ink3);cursor:pointer;padding:0;border-bottom:1px solid transparent}
  .sort button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--ink)}
  .cards{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:16px 24px 0}
  .card{border:1px solid var(--rule);border-radius:14px;overflow:hidden;background:#fff;cursor:pointer;transition:transform .15s,box-shadow .15s}
  .card:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(27,22,20,.12)}
  .card .thumb{height:92px;position:relative}
  .card .thumb small{position:absolute;top:8px;right:10px;font-size:10px;letter-spacing:.14em;background:rgba(255,255,255,.85);padding:2px 8px;border-radius:999px;color:var(--ink)}
  .card .face{width:52px;height:52px;border-radius:50%;border:3px solid #fff;background:linear-gradient(160deg,#8b7a72,#3b3230);position:absolute;left:12px;bottom:-22px;box-shadow:0 4px 10px rgba(0,0,0,.2)}
  .card .meta{padding:28px 12px 12px}
  .card .meta b{font-family:var(--min);font-weight:600;font-size:16px;display:block}
  .card .meta .g{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0}
  .card .meta .g span{font-size:10.5px;border:1px solid var(--rule);border-radius:999px;padding:1px 8px;color:var(--ink2)}
  .card .meta .next{font-size:12px;color:var(--ink2);margin-top:4px}
  .card .meta .next b{display:inline;font-family:var(--ud);font-size:12px;color:var(--wine)}
  .empty{color:var(--ink3);font-size:14px;padding:30px 24px;text-align:center;line-height:1.8}
  .week{margin:22px 24px 0;border-top:1px solid var(--rule);padding-top:14px}
  .week h4{font-family:var(--lat);font-weight:400;font-size:12px;letter-spacing:.34em;text-transform:uppercase;color:var(--ink3);margin:0 0 8px}
  .week div{display:grid;grid-template-columns:64px 1fr;gap:10px;padding:7px 0;border-bottom:1px dotted var(--rule);font-size:13px}
  .week time{font-family:var(--lat);font-size:16px}
  .frame{position:relative}
  svg.block{width:100%;height:auto;display:none}
  .frame.zoom svg.map{display:none}.frame.zoom svg.block{display:block}
  .bld{cursor:pointer}
  .bld .glow{opacity:0;transition:opacity .2s}
  .bld:hover .glow,.bld.on .glow{opacity:1}
  .bld .plate{font-family:"Kaisei Decol",var(--min);font-size:20px;font-weight:700;fill:#2b2320;pointer-events:none}
  .bld .plate.s{font-family:"Zen Kurenaido",var(--ud);font-size:13.5px;font-weight:400;fill:#5E554D}
  .crumbs{font-size:12.5px;color:var(--ink3);margin:6px 0 0}
  .crumbs b{color:var(--ink);font-weight:400;font-family:var(--min)}
  .tip{position:fixed;pointer-events:none;background:var(--ink);color:#fff;font-size:12px;padding:6px 10px;border-radius:6px;transform:translate(-50%,-140%);opacity:0;transition:opacity .15s;white-space:nowrap;z-index:20}
  .tip.on{opacity:1}
  @keyframes bob{0%,100%{transform:translate(120px,500px)}50%{transform:translate(120px,497px)}}
  .boat{animation:bob 3s ease-in-out infinite}
  @media (prefers-reduced-motion:reduce){.boat{animation:none}}
  @media (max-width:960px){.stage{grid-template-columns:1fr}.side{max-height:none;border-left:0;border-top:1px solid var(--rule)}header{grid-template-columns:1fr auto}header .search{grid-column:1/-1}.cards{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<header>
  <div class="brand">Woolsong の土地<small>声を使う人たちが住む島 ― みんなのホームページ</small></div>
  <div class="search"><input id="q" placeholder="名前・作品・楽器・都市で探す" aria-label="検索"></div>
  <div class="me"><a href="#" onclick="return false">自分の家を建てる</a></div>
</header>
<div class="stage">
  <div class="mapwrap">
    <div class="cap"><h2>島の地図 ― 分野ごとの地区。地区を押すと、近づきます</h2><button class="back" id="back">島全体へ戻る</button></div>
    <div class="frame">
    <svg class="map" id="map" viewBox="0 0 1000 680" aria-label="Woolsongの土地">
      <defs>

        <filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="table" tableValues="0 .18"/></feComponentTransfer></filter>

        <g id="house"><path d="M8 -6 L14 -10 L14 0 L8 4Z" fill="#E6DCC6" stroke="#B9AD98" stroke-width=".8"/><rect x="-8" y="-6" width="16" height="10" fill="#FBF6EA" stroke="#B9AD98" stroke-width=".8"/><path d="M-10 -6 L0 -14 L10 -6Z" fill="#7A1F2E"/><path d="M10 -6 L16 -10 L6 -18 L0 -14Z" fill="#5A1420"/><rect x="-2" y="-2" width="4" height="6" fill="#7A6455"/><rect x="-6" y="-3" width="3" height="3" fill="#3E5C8C"/></g>

        <use href="#house" x="270" y="240"/><use href="#house2" x="390" y="245"/><use href="#house" x="300" y="258"/>
        <g transform="translate(330,290)"><path class="ribbon" d="M-82 -16 H82 L88 0 L82 16 H-82 L-88 0Z"/><text class="lbl" text-anchor="middle" y="7">声楽の丘</text></g><text class="lbl s" text-anchor="middle" x="330" y="322">歌う人</text>

      <g class="dist" data-d="voice">
        <ellipse class="halo" cx="230" cy="380" rx="105" ry="80" fill="#3E5C8C" opacity=".2" filter="url(#glow)"/>
        <ellipse cx="230" cy="395" rx="90" ry="46" fill="#D9E3D0"/>

  let h=ground(d,cfg.bg);
  cfg.b.forEach(b=>{const n=PEOPLE.filter(p=>p.d===d&&p.sg===b.k).length;
    h+=`<g class="bld" data-k="${b.k}" transform="translate(${b.x},${b.y})"><ellipse class="glow" cx="0" cy="20" rx="110" ry="70" fill="${P.wine}" opacity=".16" filter="url(#glow)"/><ellipse cx="0" cy="42" rx="80" ry="10" fill="rgba(0,0,0,.08)"/>${B[b.t]()}
      <g transform="translate(0,82)"><path d="M-104 -17 H104 L112 0 L104 17 H-104 L-112 0Z" fill="#FBF8F1" stroke="#C9BFAE"/><text class="plate" text-anchor="middle" y="7">${b.n}</text></g><text class="plate s" text-anchor="middle" y="116">${b.s}${n?'　'+n+'人':''}</text></g>`;});
  h+='<rect width="1000" height="680" filter="url(#grain)" style="mix-blend-mode:multiply" pointer-events="none"/>';blk.innerHTML=h;
  blk.querySelectorAll('.bld').forEach(el=>{el.addEventListener('click',ev=>{ev.stopPropagation();subPick(el.dataset.k);});});
}

/* 一覧で探す：分野 › 建物（区分） */
function buildIndex(){const ix=document.getElementById('index');let h=`<div class="all" id="ixall">島全体 ― すべての住人<span>${PEOPLE.length}</span></div>`;
  Object.entries(DIST).forEach(([k,v])=>{const n=PEOPLE.filter(p=>p.d===k).length;h+=`<details data-d="${k}" ${cur===k?'open':''}><summary class="${cur===k&&!subKey?'on':''}"><i style="background:${v.c}"></i>${v.n}<span class="c">${n}</span><span class="arrow">▶</span></summary><ul>${SUB[k].b.map(b=>{const m=PEOPLE.filter(p=>p.d===k&&p.sg===b.k).length;return `<li data-d="${k}" data-k="${b.k}" class="${cur===k&&subKey===b.k?'on':''}">${b.n}<span>${m}</span></li>`;}).join('')}</ul></details>`;});
  ix.innerHTML=h;
  ix.querySelector('#ixall').onclick=whole;
  ix.querySelectorAll('summary').forEach(sm=>sm.addEventListener('click',e=>{const d=sm.parentElement.dataset.d;if(cur!==d){e.preventDefault();pick(d);}}));
  ix.querySelectorAll('li').forEach(li=>li.onclick=()=>{const d=li.dataset.d,k=li.dataset.k;if(cur!==d){pick(d);setTimeout(()=>subPick(k),750);}else{subPick(k);}});
}
let subKey=null;
function subPick(k){subKey=(subKey===k?null:k);document.querySelectorAll('#block .bld').forEach(x=>x.classList.toggle('on',x.dataset.k===subKey));const b=SUB[cur].b.find(x=>x.k===k);document.getElementById('crumbs').innerHTML=`島全体 › <b>${DIST[cur].n}</b>`+(subKey?` › <b>${b.n}</b>`:'');document.getElementById('title').textContent=subKey?b.n:DIST[cur].n;document.getElementById('sub').textContent=subKey?b.s+' ― '+DIST[cur].n:DIST[cur].s;render();}

const svg=document.getElementById('map'), sheep=document.getElementById('sheep'), tip=document.getElementById('tip'), back=document.getElementById('back');
const FULL=[0,0,1000,680]; let cur=null, gf=null, sortKey='new';
function animateView(to){const from=svg.getAttribute('viewBox').split(' ').map(Number);const t0=performance.now();const dur=650;function step(t){const p=Math.min(1,(t-t0)/dur);const e=1-Math.pow(1-p,3);const v=from.map((f,i)=>f+(to[i]-f)*e);svg.setAttribute('viewBox',v.join(' '));if(p<1)requestAnimationFrame(step);}requestAnimationFrame(step);}
function pick(d){cur=d;gf=null;subKey=null;document.querySelectorAll('.dist').forEach(x=>x.classList.toggle('on',x.dataset.d===d));const D=DIST[d];animateView([D.cx-260,D.cy-180,520,354]);sheep.setAttribute('transform',`translate(${D.cx+40},${D.cy+30})`);back.classList.add('on');document.getElementById('title').textContent=D.n;document.getElementById('sub').textContent=D.s;document.getElementById('crumbs').innerHTML=`島全体 › <b>${D.n}</b>`;render();setTimeout(()=>{drawBlock(d);document.querySelector('.frame').classList.add('zoom');},700);}
function whole(){cur=null;gf=null;subKey=null;document.querySelector('.frame').classList.remove('zoom');document.getElementById('crumbs').textContent='島全体';document.querySelectorAll('.dist').forEach(x=>x.classList.remove('on'));svg.setAttribute('viewBox',FULL.join(' '));back.classList.remove('on');document.getElementById('title').textContent='島全体';document.getElementById('sub').textContent='声を使う人たちが、分野ごとの地区に住んでいます。地区を押すと、そこに住む人のページが並びます。誰も順位づけされません。';render();}
back.onclick=whole;
document.querySelectorAll('.dist').forEach(el=>{el.addEventListener('click',()=>pick(el.dataset.d));el.addEventListener('mousemove',e=>{tip.textContent=DIST[el.dataset.d].n+' ― '+PEOPLE.filter(p=>p.d===el.dataset.d).length+'人';tip.style.left=e.clientX+'px';tip.style.top=e.clientY+'px';tip.classList.add('on');});el.addEventListener('mouseleave',()=>tip.classList.remove('on'));});
const legend=document.getElementById('legend');Object.entries(DIST).forEach(([k,v])=>{const b=document.createElement('button');b.innerHTML=`<i style="background:${v.c}"></i>${v.n}`;b.onclick=()=>{pick(k);legend.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));};legend.appendChild(b);});
document.querySelectorAll('#sort button').forEach(b=>b.onclick=()=>{sortKey=b.dataset.s;document.querySelectorAll('#sort button').forEach(x=>x.setAttribute('aria-pressed',x===b));render();});
const cards=document.getElementById('cards'), filters=document.getElementById('filters'), week=document.getElementById('week'), q=document.getElementById('q'), count=document.getElementById('count');
function render(){
  buildIndex();
  const qq=q.value.trim();
  let list=PEOPLE.filter(p=>(!cur||p.d===cur)&&(!subKey||p.sg===subKey)&&(!qq||(p.n+p.g.join()+p.t+p.c).includes(qq)));
  const genres=[...new Set(list.flatMap(p=>p.g))];
  filters.innerHTML='';filters.style.display=cur?'flex':'none';genres.forEach(g=>{const b=document.createElement('button');b.textContent=g;b.setAttribute('aria-pressed',gf===g);b.onclick=()=>{gf=(gf===g?null:g);render();};filters.appendChild(b);});
  if(gf)list=list.filter(p=>p.g.includes(gf));
  list.sort((a,b)=>sortKey==='new'?b.joined-a.joined:sortKey==='next'?a.nd-b.nd:a.n.localeCompare(b.n,'ja'));
  count.textContent=list.length+' 人が住んでいます';
  cards.innerHTML='';
  if(!list.length){cards.innerHTML='<div class="empty" style="grid-column:1/-1">ここには、まだ誰も住んでいません。<br>最初の一人になれます。</div>';}
  list.forEach(p=>{const c=document.createElement('div');c.className='card';c.innerHTML=`<div class="thumb" style="background:${THEMES[p.t]||'#ccc'}"><small>型 ${p.t}</small><div class="face"></div></div><div class="meta"><b>${p.n}</b><div class="g">${p.g.map(x=>`<span>${x}</span>`).join('')}<span>${p.c}</span></div><div class="next">次：<b>${p.next}</b></div></div>`;c.onclick=()=>alert(p.n+' のページを開きます（試作）');cards.appendChild(c);});
  const wk=(cur?PEOPLE.filter(p=>p.d===cur):PEOPLE.slice()).filter(p=>p.nd<99999999).sort((a,b)=>a.nd-b.nd).slice(0,6);
  week.innerHTML='<h4>'+(cur?'この地区の、近い本番':'島の、近い本番')+'</h4>'+wk.map(p=>`<div><time>${p.next.split(' ')[0]}</time><span>${p.n} ― ${p.next.split(' ').slice(1).join(' ')}</span></div>`).join('');
}
q.addEventListener('input',render);render();
</script>
</body>
